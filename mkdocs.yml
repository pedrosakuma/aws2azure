          - Latest footprint baseline: perf/footprint-latest.md
          - CosmosBinary decode investigation: perf/cosmos-binary-decode.md
          - CosmosBinary encode investigation: perf/cosmos-binary-encode-spike.md
          - Fused CosmosBinary decode: perf/cosmos-binary-fused-decode-spike.md
          - Cosmos query-body encoding: perf/cosmos-query-body-encode.md
