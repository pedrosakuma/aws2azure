site_name: aws2azure documentation
site_description: Evaluate, integrate, deploy, and operate the aws2azure AWS-to-Azure protocol proxy
site_url: https://pedrosakuma.github.io/aws2azure/
repo_url: https://github.com/pedrosakuma/aws2azure
repo_name: pedrosakuma/aws2azure
docs_dir: docs
site_dir: site
strict: true
use_directory_urls: true

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-night
        name: Use dark theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue grey
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Use light theme

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

hooks:
  - .github/scripts/mkdocs_hooks.py

extra_css:
  - assets/stylesheets/portal.css

exclude_docs: |
  **/*.csv
  **/*.json
  **/*.yaml
  **/*.yml

not_in_nav: |
  site/operations/**/*.md
  site/design-gaps/**/*.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
    anchors: warn

nav:
  - Home: index.md
  - Evaluate:
      - Project maturity: project-maturity.md
      - Adoption checklist: adoption.md
      - Workload compatibility: site/workload-compatibility.md
      - Workload GA certification: site/workload-ga.md
      - Operation coverage: site/coverage.md
      - Maximum-viable completeness: site/completeness.md
      - Design gaps: site/design-gaps.md
      - Real-Azure evidence: site/divergences.md
  - "Build & integrate":
      - Getting started: getting-started.md
      - Operator configuration: configuration-schema.md
      - Complete field reference: configuration-reference.md
      - Environment and overrides: configuration-environment.md
      - Production examples: configuration-examples.md
      - Azure authentication: azure-authentication.md
      - Presigned URLs: presigned-urls.md
      - Workload profiles:
          - Profile overview: workloads/README.md
          - DynamoDB basic CRUD: workloads/dynamodb-basic-crud.md
          - DynamoDB Query and Scan: workloads/dynamodb-query-scan-indexes.md
          - DynamoDB transactions: workloads/dynamodb-single-partition-transactions.md
          - Kinesis record ingestion: workloads/kinesis-basic-record-ingestion.md
          - Kinesis shard consumer: workloads/kinesis-single-consumer-per-shard.md
          - S3 object CRUD: workloads/s3-basic-object-crud.md
          - S3 metadata compatibility: workloads/s3-metadata-compatibility.md
          - Secrets Manager lifecycle: workloads/secretsmanager-basic-lifecycle.md
          - SNS publish to Event Grid: workloads/sns-standard-publish-event-grid.md
          - SNS publish to Service Bus: workloads/sns-standard-publish-service-bus.md
          - SNS subscription management: workloads/sns-subscription-management-service-bus.md
          - SQS dead-letter redrive: workloads/sqs-dlq-redrive.md
          - SQS FIFO over AMQP: workloads/sqs-fifo-amqp.md
          - SQS standard messaging: workloads/sqs-standard-messaging.md
  - "Deploy & operate":
      - Sidecar deployment: deployment/sidecar.md
      - Build-time module selection: deployment/module-selection.md
      - Production runbook: deployment/production-runbook.md
      - Troubleshooting: troubleshooting.md
      - Release-candidate canary: testing/rc-staging-canary.md
      - Operational qualification: testing/operational-qualification.md
      - SLO qualification: testing/slo-qualification.md
      - Real-Azure validation: testing/real-azure-nightly.md
      - Local real-Azure repro: testing/local-real-azure-repro.md
      - Real-AWS differential capture: testing/real-aws-capture.md
      - Local real-AWS reproduction: testing/local-real-aws-repro.md
      - Documentation retrieval evaluation: testing/retrieval-eval.md
      - Documentation quality suite: testing/documentation-quality.md
      - Performance and footprint:
