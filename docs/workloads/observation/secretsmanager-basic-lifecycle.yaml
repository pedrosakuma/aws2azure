# Reviewed RC observation generation policy, not runtime evidence.
# The real-Azure workflow emits measured evidence only as immutable run artifacts.
schema_version: 1
profile_id: secretsmanager-basic-lifecycle
profile_version: 1
minimum_window_minutes: 60
maximum_window_minutes: 180
maximum_evidence_age_hours: 72
minimum_samples_per_cohort: 300
load_shape:
  candidate_concurrency: 5
  stable_concurrency: 5
  operation_mix_identity: sha256:a1eb9a5a04c0d38239ef7266b1c4a9d4e7e154edaf741b5d87db1a680a5f57bb
metrics:
  - id: representative-load-throughput
    unit: throughput_per_sec
    threshold_source: qualification_signal
    threshold_reference: representative-load-throughput
    # Qualification measures ONE cohort in isolation; observation runs the
    # candidate and stable cohorts CONCURRENTLY on a single shared runner.
    # For this backend (Key Vault TLS/crypto overhead) that concurrency
    # halves per-cohort throughput vs the isolated qualification measurement,
    # so the qualification-derived 9 ops/sec floor is structurally
    # unreachable here regardless of candidate health -- confirmed by
    # v1.1.0-rc.8 run 34513400424 (candidate 4.92, stable 5.0 ops/sec,
    # combined ~9.92, matching the pre-Key-Vault-split ~10.7 ops/sec ceiling
    # from #1003; the Key Vault split did not change aggregate throughput,
    # proving the bottleneck is shared-runner CPU, not the backend). 4.5
    # ops/sec is half of the qualification floor, matching the structural
    # halving observed, with margin below the single initial measurement.
    # Revisit once #1007 (separate runners per cohort) removes the runner
    # contention and restores headroom to use the full qualification floor.
    observation_threshold_override: 4.5
    observation_threshold_justification: >-
      Concurrent dual-cohort single-runner CPU contention structurally halves
      throughput for this backend; see #1007 for the architectural fix and
      v1.1.0-rc.8 run 34513400424 for the measurement basis.
  - id: operation-failure-rate
    unit: ratio
    threshold_source: qualification_rule
    threshold_reference: max_failure_rate
