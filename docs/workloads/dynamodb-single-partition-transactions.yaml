schema_version: 1
id: dynamodb-single-partition-transactions
version: 1
name: DynamoDB single-table single-partition transactions
minimum_proxy_version: 0.1.0
real_azure_seal_max_age_days: 90
operations:
  - dynamodb:TransactGetItems
  - dynamodb:TransactWriteItems
requirements:
  - dynamodb_single_partition_transactions
accepted_partial_operations:
  - dynamodb:TransactGetItems
  - dynamodb:TransactWriteItems
accepted_design_gaps:
  - "dynamodb:Transaction scope is single-partition, single-table"
required_sub_feature_seals:
  - operation: dynamodb:TransactGetItems
    sub_feature: Single-table single-partition snapshot
  - operation: dynamodb:TransactGetItems
    sub_feature: ProjectionExpression / ExpressionAttributeNames (per item)
  - operation: dynamodb:TransactWriteItems
    sub_feature: Atomic Put / Delete / ConditionCheck
  - operation: dynamodb:TransactWriteItems
    sub_feature: ConditionExpression transaction subset
  - operation: dynamodb:TransactWriteItems
    sub_feature: Positional CancellationReasons
