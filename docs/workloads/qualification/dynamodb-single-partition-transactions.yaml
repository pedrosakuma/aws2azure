# Initial policy for the production-shaped single-partition transaction
# workload. The first complete compatible protected-main runtime is recorded as
# a rollback-only bootstrap. A later distinct runtime must still pass rollback
# correctness, three production-shaped load runs, and final review before any
# promotion, candidate, approved, or GA claim.
# Qualification currently provisions a single-write Cosmos account. Any future
# multi-write run must configure one authoritative preferred writable region;
# transaction execution must never fail over between writable regions.
schema_version: 1
profile_id: dynamodb-single-partition-transactions
profile_version: 1
rules:
  max_artifact_age_hours: 72
  min_samples_per_scenario: 300
  min_duration_seconds: 300
  max_failure_rate: 0
  zero_completions_disqualify: true
  only_skipped_real_azure_disqualifies: true
  min_distinct_runs: 3
load_shape:
  concurrency: 1
  requested_duration_seconds: 300
scenarios:
  - id: representative-load
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals:
      - id: representative-load-throughput
        source: backend_capacity
        disposition: blocking
        metric: throughput_per_sec
        threshold_status: resolved
        min_value: 1.4
        threshold_reason: >-
          Three comparable zero-failure protected-main live-Cosmos runs for
          candidate ee840d6481bf09be8c5f2b095516c84d44cc948d completed at
          1.481245, 1.874342, and 1.855369 transactions per second (workflow
          runs 30225815426, 30226615491, and 30227515778). The 1.4 floor is
          deliberately below the worst healthy run, does not average away that
          run's higher network latency, and uses neither emulator nor A/B data.
      - id: representative-load-p95
        source: backend_capacity
        disposition: report_only
        metric: p95_ms
      - id: representative-load-p99
        source: backend_capacity
        disposition: report_only
        metric: p99_ms
      - id: representative-load-throttle-rate
        source: backend_capacity
        disposition: report_only
        metric: throttle_rate
  - id: transaction-read-after-write
    service: dynamodb
    operation: TransactGetItems
    evidence_source: real_azure
    signals: []
  - id: transaction-region-pinning
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: deterministic
    signals: []
  - id: transaction-preflight-contracts
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: deterministic
    signals: []
  - id: transaction-atomicity-rollback
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: transaction-conditions-cancellation
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: transaction-scope-rejection
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: transaction-idempotency
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: transaction-contention
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: transaction-restart-versioning
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: transaction-sproc-body-verification
    service: dynamodb
    operation: TransactWriteItems
    evidence_source: real_azure
    signals: []
  - id: rollback
    service: dynamodb
    operation: TransactGetItems
    evidence_source: real_azure
    signals: []
