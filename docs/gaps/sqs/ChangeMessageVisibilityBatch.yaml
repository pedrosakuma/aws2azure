service: sqs
operation: ChangeMessageVisibilityBatch
azure_equivalent: Azure Service Bus queue runtime REST API — bounded parallel PUT Unlock calls for VisibilityTimeout=0 and POST RenewLock calls for positive values.
status: partial
sub_features:
- name: 1..10 entries per batch
  status: implemented
- name: Per-entry Id validation (alnum/_/-, 1..80 chars, unique)
  status: implemented
- name: Per-entry VisibilityTimeout 0..43200 validation
  status: implemented
  notes: Non-integer / out-of-range entries fail with SenderFault InvalidParameterValue while siblings succeed.
- name: Bounded parallelism
  status: implemented
  notes: 5-way concurrency cap; lock-renew calls are individually short.
- name: VisibilityTimeout=0 (immediate release)
  status: implemented
  notes: REST entries use Service Bus Unlock Message (PUT), and the mixed-batch real-Azure conformance scenario verifies that they promptly re-expose the delivery. AMQP entries use Abandon and keep the same immediate-release contract on that transport.
- name: Renew semantics
  status: partial
  notes: SB renewlock extends the lock by the queue's configured LockDuration, ignoring the requested VisibilityTimeout — see behavior_differences.
  disposition: by_design
behavior_differences:
- SB has no per-call visibility override on REST. The proxy validates and accepts the VisibilityTimeout value but SB always extends by the queue's LockDuration. Callers needing an arbitrary new visibility must Delete+Send or rely on SetQueueAttributes to change the queue-wide LockDuration.
- The dedicated `batch-visibility-timeout` real-Azure scenario targets the REST lane directly, mixing zero-timeout, positive-timeout, and invalid-handle entries so nightly live-Azure runs can verify per-entry outcomes, prompt zero-timeout redelivery, and that renewed siblings stay hidden past the original lock-expiry boundary.
- 'AMQP transport (Phase 2.5): when a queue is configured with `transport: Amqp`, ChangeMessageVisibilityBatch routes to the AMQP path — each entry with VisibilityTimeout=0 abandons via the cached (session) receiver, matching the prompt re-visibility now verified on the REST path as well. Positive VisibilityTimeout values RenewLock via the SB `$management` link (session-aware for v3 receipt handles); SB clamping is silent in the batch shape (the singular CMV emits the `Aws2Azure-VisibilityClamped` header but the batch response has no per-entry place to carry it).'
references:
- https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_ChangeMessageVisibilityBatch.html
- https://learn.microsoft.com/rest/api/servicebus/unlock-message
- https://learn.microsoft.com/rest/api/servicebus/renew-lock
disposition: by_design
