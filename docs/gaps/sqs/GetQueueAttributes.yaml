service: sqs
operation: GetQueueAttributes
azure_equivalent: GET https://{namespace}.servicebus.windows.net/{queue}?api-version=2021-05 (Atom QueueDescription)
status: partial
sub_features:
- name: Attribute.VisibilityTimeout
  status: implemented
  notes: Translated from Service Bus LockDuration.
- name: Attribute.MessageRetentionPeriod
  status: implemented
  notes: Translated from DefaultMessageTimeToLive.
- name: Attribute.MaximumMessageSize
  status: implemented
  notes: Derived from MaxMessageSizeInKilobytes; defaults to 1 MiB (1048576 bytes) when absent — matches the current SQS default (raised from 256 KiB to 1 MiB in August 2025).
- name: Attribute.DelaySeconds
  status: implemented
  notes: Returned from aws2azure's QueueDescription.UserMetadata blob when a queue-default DelaySeconds value was created or updated through the proxy.
- name: Attribute.ReceiveMessageWaitTimeSeconds
  status: implemented
  notes: Returned from aws2azure's QueueDescription.UserMetadata blob when a queue-default ReceiveMessageWaitTimeSeconds value was created or updated through the proxy.
- name: Attribute.ApproximateNumberOfMessages
  status: implemented
  notes: Mapped from Service Bus MessageCount when the property is present in the Atom response.
- name: Attribute.ApproximateNumberOfMessagesNotVisible / Delayed
  status: implemented
  notes: ApproximateNumberOfMessagesDelayed maps from ScheduledMessageCount. ApproximateNumberOfMessagesNotVisible is derived best-effort from MessageCount minus visible, scheduled, and transfer/dead-letter counts.
- name: Attribute.CreatedTimestamp / LastModifiedTimestamp
  status: implemented
  notes: Surfaced from the Atom entry's published/updated timestamps.
- name: Attribute.QueueArn
  status: implemented
  notes: Synthesized as arn:aws:sqs:us-east-1:000000000000:{queue}, matching the proxy's placeholder account convention used elsewhere in the SQS surface.
- name: Attribute.RedrivePolicy
  status: implemented
  notes: Emitted as JSON {deadLetterTargetArn, maxReceiveCount} when the SB queue has ForwardDeadLetteredMessagesTo set. The synthetic ARN uses arn:aws:sqs:us-east-1:000000000000:{queue}, consistent with the proxy placeholder account and DLQ attribution.
- name: Attribute.RedriveAllowPolicy
  status: unsupported
  gap: SB has no per-queue ACL controlling which sources may forward into a DLQ.
  disposition: by_design
- name: AttributeNames=All
  status: implemented
behavior_differences:
- AttributeNames filtering happens proxy-side after the full Atom response is parsed.
- Service Bus has no native queue-level DelaySeconds or ReceiveMessageWaitTimeSeconds fields. aws2azure returns the proxy-owned defaults it persisted in QueueDescription.UserMetadata.
- ApproximateNumberOfMessagesNotVisible is a best-effort projection derived from Service Bus aggregate counters; Service Bus does not expose an exact SQS-style in-flight-only count.
- Real-Azure conformance coverage exists in Aws2Azure.IntegrationTests.Sqs.SqsRealAzureConformanceTests.Queue_metadata_and_tags_round_trip_against_real_service_bus; it was not executed in this environment.
references:
- https://docs.aws.amazon.com/AWSSimpleQueueService/latest/APIReference/API_GetQueueAttributes.html
disposition: by_design
