service: sns
operation: SetTopicAttributes
azure_equivalent: Azure Service Bus topic description
status: partial
verified_real_azure:
  date: '2026-08-20'
  evidence: https://github.com/pedrosakuma/aws2azure/actions/runs/32322056873
  workflow_run: https://github.com/pedrosakuma/aws2azure/actions/runs/32322056873
disposition: by_design
sub_features:
- name: Topic metadata-backed attribute updates
  status: implemented
  notes: Performs a GET → conditional PUT cycle against the Service Bus topic description and persists DisplayName, Policy, and DeliveryPolicy inside TopicDescription.UserMetadata for later GetTopicAttributes projection.
- name: Compatibility no-ops
  status: implemented
  notes: Treats EffectiveDeliveryPolicy, KmsMasterKeyId, SignatureVersion, and TracingConfig as successful no-ops because this slice has no faithful Service Bus topic equivalent for those AWS attributes.
- name: Content-based deduplication validation
  status: implemented
  notes: Reads the current Service Bus topic description and rejects attempts to change RequiresDuplicateDetection after topic creation. Re-applying the existing value returns success.
- name: FIFO throughput-scope metadata updates
  status: implemented
  notes: Validates Topic or MessageGroup for .fifo topics, persists the selected value in TopicDescription.UserMetadata, and invalidates the local observed-state cache. FIFO Publish / PublishBatch re-read authoritative topic metadata so other proxy replicas observe the update without a restart.
behavior_differences:
- DisplayName, Policy, and DeliveryPolicy are stored in TopicDescription.UserMetadata for round-tripping. Azure Service Bus does not evaluate SNS IAM-style topic policies or SNS delivery retry JSON, so those attributes remain metadata-only compatibility state rather than native enforcement.
- ContentBasedDeduplication is backed by RequiresDuplicateDetection, but Service Bus does not allow changing that property after topic creation. aws2azure returns InvalidParameter instead of attempting an in-place update.
- FifoThroughputScope changes only how aws2azure derives the Service Bus broker MessageId used for duplicate detection. It does not reconfigure Service Bus capacity, partitioning, messaging units, or per-session throughput, so selecting MessageGroup does not provide AWS SNS throughput quotas or isolation. FIFO publishes read the authoritative topic metadata rather than trusting process-lifetime cached scope, preserving updates and retry determinism across proxy replicas. Covered by SetTopicAttributesHandlerTests.HandleAsync_updates_fifo_throughput_scope_metadata, PublishHandlerTests.HandleAsync_reloads_mutable_scope_instead_of_using_stale_cached_metadata, and SnsTopicLifecycleServiceBusTests.Fifo_throughput_scope_create_get_and_set_roundtrips_on_service_bus_emulator.
- FifoThroughputScope rejects values other than Topic or MessageGroup and rejects standard topics with InvalidParameter. Covered by SetTopicAttributesHandlerTests.HandleAsync_rejects_invalid_fifo_throughput_scope and the sns-invalid-fifo-throughput-scope conformance case.
- EffectiveDeliveryPolicy, KmsMasterKeyId, SignatureVersion, and TracingConfig remain no-ops because the Service Bus-backed profile has no faithful equivalent AWS topic-level behavior to apply.
- Updates whose serialized topic metadata would exceed the Azure Service Bus UserMetadata 1024-character limit are rejected with InvalidParameter.
- Unknown AWS attribute names return InvalidParameter.
- Real-Azure verification confirms mutable metadata-backed DisplayName updates persist onto the live Service Bus topic description and are observable through a follow-up GetTopicAttributes call (see SnsRealAzureConformanceTests.Topic_metadata_attributes_round_trip_against_real_service_bus).
