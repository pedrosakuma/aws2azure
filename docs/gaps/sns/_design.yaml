service: sns
design_gaps:
- area: Two backends with different fidelity
  status: by_design
  readiness_checklist_question: "Do you need Publish or PublishBatch semantics to stay identical across the Service Bus and Event Grid backends?"
  summary: A topic can be backed by Service Bus Topics (AMQP) or Event Grid, and the two backends do not offer identical semantics. On Event Grid the proxy emits the classic Event Grid schema (eventType=aws.sns.Message), the subject is always the TopicArn, and PublishBatch uses proxied per-entry outcomes; on Service Bus the delivery model and partial-failure shape differ.
  impact: The same SNS Publish/PublishBatch can behave differently depending on the configured backend; partial-failure semantics may diverge from SNS.
  workaround: Pick the backend per topic based on the delivery semantics required and test partial-failure handling against it.
  references:
  - https://learn.microsoft.com/azure/event-grid/post-to-custom-topic
- area: FIFO topics are deferred
  status: partial
  readiness_checklist_question: "Do you require full SNS FIFO parity, including consumer-side session provisioning and unbounded deduplication semantics?"
  summary: 'aws2azure supports a bounded Service Bus subset for SNS .fifo topics. On the Service Bus backend, MessageGroupId maps to SessionId (AMQP group-id), MessageDeduplicationId maps to broker MessageId, and ContentBasedDeduplication=true falls back to SHA-256(message body) when no dedup id is supplied. Event Grid still cannot honor FIFO semantics and rejects .fifo topics plus FIFO-only request fields. Reclassified from feasible_backlog to by_design after re-review for #800: the three residual gaps below are structural boundaries of the Service Bus AMQP entity model rather than something further engineering here can close.'
  impact: 'The proxy can approximate SNS FIFO only within the Service Bus backend''s native limits, for structural reasons: (1) Service Bus has no concept of an SNS-compatible, globally-orderable SequenceNumber -- its sequence number is a per-entity, broker-local counter with no cross-entity or cross-region portability guarantee, so surfacing it as an SNS SequenceNumber would misrepresent a guarantee the backend does not provide; (2) Service Bus duplicate detection is an intentionally time-windowed, broker-side dedup cache (bounded by DuplicateDetectionHistoryTimeWindow) with no unbounded, SNS-parity dedup guarantee to request; (3) making the SNS subscription-management APIs (Subscribe et al.) provision session-aware Service Bus subscriptions by default would require guessing a RequiresSession=true topology up front for every subscription regardless of whether the topic is FIFO, which is unsafe for non-FIFO topics and would need a new, deliberate opt-in configuration surface rather than a translation-fidelity fix.'
  workaround: Use the Service Bus backend for FIFO topics, keep publish retries within the topic's duplicate-detection window, and provision session-aware Service Bus subscriptions with Azure-native tooling when guaranteed ordered processing matters.
  disposition: by_design
- area: Service Bus Geo-DR requires alias-based failover planning
  status: by_design
  readiness_checklist_question: "Do you need Service Bus-backed SNS failover without preconfiguring and rehearsing the Geo-DR alias?"
  summary: Service Bus-backed SNS publish and subscription-management flows inherit Service Bus Geo-DR's alias model. The proxy must target the Geo-DR alias hostname/FQDN to follow failover; direct primary-namespace endpoints keep pointing at the old region. Geo-DR replicates topic/subscription metadata, including proxy-managed SNS subscription descriptions, but not queued topic/subscription messages or other live broker state.
  impact: Regional failover for Service Bus-backed SNS workloads is not transparent unless callers route through the alias and rehearse failover. Proxy-created subscription entities survive as metadata, but buffered deliveries in those subscriptions do not; workloads that require active/active message replication or preserved in-flight backlog need Service Bus Geo-Replication instead of Geo-DR.
  workaround: Configure Service Bus-backed SNS bindings to use the Geo-DR alias for data-plane and management-plane endpoints, use safe failover so pending metadata replications complete, and choose Geo-Replication when the workload must preserve queued topic/subscription data across regions.
  references:
  - https://learn.microsoft.com/en-us/azure/service-bus-messaging/service-bus-geo-dr
  disposition: by_design
- area: Event Grid custom-topic failover remains best-effort and external
  status: by_design
  readiness_checklist_question: "Do you require rapid, built-in regional failover for Event Grid-backed SNS topics?"
  summary: The SNS Event Grid backend targets classic Event Grid custom topics via EventGridCredentials.Endpoint or namespace+topicName-derived /api/events endpoints. Those topics are single-region for steady-state traffic; Azure's cross-region recovery is metadata-only and Microsoft-managed on a best-effort timeline, not a customer-controlled fast failover. Event Grid namespaces provide a different multitenant model that this proxy does not use for SNS publish.
  impact: Regional outages on an Event Grid-backed SNS topic can interrupt Publish and PublishBatch for an extended period, and any unprocessed event data in the failed region can be lost. The proxy cannot provide SNS-style rapid regional failover or active/active publish continuity for this backend by itself.
  workaround: 'Treat the Event Grid backend as requiring an external multiregion DR plan: configure retries/idempotency, dead-letter or archive where needed, and build client-side failover to separately provisioned Event Grid resources if bounded regional failover time matters.'
  references:
  - https://learn.microsoft.com/en-us/azure/reliability/reliability-event-grid
  - https://learn.microsoft.com/en-us/azure/event-grid/post-to-custom-topic
  disposition: by_design
- area: Event Grid publish auth omits SAS-token mode
  status: partial
  readiness_checklist_question: "Do you need the SNS Event Grid backend to accept or mint time-bounded Event Grid SAS publish tokens?"
  summary: 'SNS Event Grid publishing currently supports only static access-key auth (`aeg-sas-key`) and Microsoft Entra bearer tokens. It does not accept or generate Event Grid SAS tokens (`aeg-sas-token` / `Authorization: SharedAccessSignature`) for time-bounded publish delegation.'
  impact: Multi-tenant or delegated deployments cannot use short-lived, scopeable Event Grid SAS publish tokens through the proxy. Operators must either distribute a long-lived shared key or rely on Entra-issued bearer tokens.
  workaround: Use Entra ID where possible, or provision/rotate Event Grid shared keys outside the proxy. Do not assume the SNS Event Grid backend can consume precomputed SAS tokens today.
  references:
  - https://learn.microsoft.com/en-us/azure/event-grid/authenticate-with-access-keys-shared-access-signatures
  disposition: by_design
- area: No AWS region / account namespace
  status: by_design
  readiness_checklist_question: "Do your callers depend on real AWS account or region values inside SNS ARNs?"
  summary: Topic and subscription ARNs are synthesised as arn:aws:sns:{sigv4-region}:000000000000:{name}; the account id is a stable placeholder because the proxy is not backed by an AWS account namespace.
  impact: Applications that parse account id or cross-account references out of an ARN will see placeholder values.
  workaround: Do not depend on the account/region portion of returned ARNs.
  references:
  - https://github.com/pedrosakuma/aws2azure/issues/267
- area: No IAM-backed policy surface
  status: unsupported
  readiness_checklist_question: "Do you rely on SNS policy attributes such as DeliveryPolicy, RedrivePolicy, or SubscriptionRoleArn being enforced?"
  summary: DeliveryPolicy, RedrivePolicy, and SubscriptionRoleArn are accepted as no-ops because Service Bus / Event Grid expose no matching SNS attribute contract, and there is no server-side IAM evaluation.
  impact: Retry/redrive policy and role-based delivery configured via these attributes have no effect.
  workaround: Configure delivery reliability at the Azure backend level; do not rely on SNS policy attributes being enforced.
  disposition: by_design
- area: Event Grid subscription management is excluded
  status: unsupported
  readiness_checklist_question: "Do you need SNS Subscribe and Unsubscribe APIs to create or manage Azure Event Grid event subscriptions?"
  summary: Subscribe, ConfirmSubscription, ListSubscriptions, ListSubscriptionsByTopic, GetSubscriptionAttributes, SetSubscriptionAttributes, and Unsubscribe translate only to Azure Service Bus topic subscriptions. They never create, enumerate, mutate, confirm, or delete Azure Event Grid event subscriptions.
  impact: An SNS topic whose publish backend is Event Grid does not gain Event Grid delivery fan-out from the SNS subscription-management APIs, and its events are not delivered into Service Bus subscriptions created by those APIs.
  workaround: Provision and operate Event Grid event subscriptions with Azure-native tooling, or select the Service Bus Topics publish backend when this profile is required.
  references:
  - https://learn.microsoft.com/azure/event-grid/manage-event-delivery
  disposition: by_design
- area: Event Grid topic lifecycle remains external
  status: by_design
  readiness_checklist_question: "Do you expect CreateTopic or DeleteTopic to create or delete the underlying Azure Event Grid topic?"
  summary: When SNS routing resolves to Event Grid, Publish and PublishBatch use the configured Event Grid endpoint/credentials directly. CreateTopic and DeleteTopic still manage only the Service Bus compatibility topic used for SNS metadata/subscriptions; they do not create, delete, or existence-check the Azure Event Grid custom topic.
  impact: Deleting the SNS topic through this compatibility layer does not prevent later Event Grid publishes to the same TopicArn while the configured Event Grid topic still exists and remains reachable.
  workaround: Provision, validate, and delete Azure Event Grid custom topics with Azure-native tooling; treat SNS CreateTopic / DeleteTopic as Service Bus compatibility-state management only when Event Grid is the publish backend.
  references:
  - https://learn.microsoft.com/azure/event-grid/post-to-custom-topic
  disposition: by_design
- area: Default Event Grid routing multiplexes multiple SNS topics
  status: by_design
  readiness_checklist_question: "Do different SNS topics need separate Azure Event Grid resources for isolation, quotas, or RBAC by default?"
  summary: Without a per-topic Event Grid endpoint override, all SNS topics that resolve to Event Grid publish into the same configured Azure Event Grid custom topic endpoint. Topic identity is preserved only inside the emitted envelope (subject / data.TopicArn), not as distinct Azure topic resources.
  impact: Azure-side isolation, quotas, monitoring, and RBAC apply at the shared Event Grid topic unless callers deliberately configure separate Event Grid endpoints for different SNS topics or topic-patterns.
  workaround: Configure per-topic eventGridTopicEndpoint overrides whenever separate Azure Event Grid resources are required for isolation or lifecycle reasons.
  references:
  - https://learn.microsoft.com/azure/event-grid/post-to-custom-topic
  disposition: by_design
workload_patterns:
- id: sns_standard_publish
  name: Standard topic publish
  compatibility: conditional
  summary: Publish and PublishBatch route through Service Bus Topics or Event Grid, whose delivery and partial-failure semantics differ.
  operations:
  - CreateTopic
  - Publish
  - PublishBatch
  - DeleteTopic
  design_gaps:
  - Two backends with different fidelity
  - Service Bus Geo-DR requires alias-based failover planning
  - Event Grid custom-topic failover remains best-effort and external
  - Event Grid publish auth omits SAS-token mode
  - Event Grid topic lifecycle remains external
  - Default Event Grid routing multiplexes multiple SNS topics
  guidance: Select the backend deliberately; for Service Bus use the Geo-DR alias if regional failover matters, and for Event Grid plan external multiregion failover plus the currently supported auth mode (shared key or Entra bearer).
- id: sns_subscription_management
  name: Subscription management
  compatibility: conditional
  summary: Subscription lifecycle and attributes are translated through Service Bus management APIs with synthetic AWS identifiers.
  operations:
  - Subscribe
  - ConfirmSubscription
  - ListSubscriptions
  - ListSubscriptionsByTopic
  - GetSubscriptionAttributes
  - SetSubscriptionAttributes
  - Unsubscribe
  design_gaps:
  - Two backends with different fidelity
  - No AWS region / account namespace
  - Service Bus Geo-DR requires alias-based failover planning
  - Event Grid subscription management is excluded
  guidance: Use this profile only with the Service Bus Topics backend, route through the Geo-DR alias when regional failover matters, avoid parsing AWS account identity from returned ARNs, and provision Event Grid event subscriptions separately when Event Grid is selected for publishing.
- id: sns_fifo
  name: FIFO topic ordering and deduplication
  compatibility: conditional
  summary: A Service Bus-backed subset exists for .fifo topics, but full SNS FIFO parity is not reproduced end to end.
  operations:
  - CreateTopic
  - Publish
  - PublishBatch
  - DeleteTopic
  design_gaps:
  - FIFO topics are deferred
  guidance: Use the Service Bus backend only, supply MessageGroupId on every publish, rely on MessageDeduplicationId or ContentBasedDeduplication within the broker's duplicate-detection window, and provision session-aware Service Bus subscriptions outside the SNS compatibility APIs when consumer-side ordering must be guaranteed.
- id: sns_policy_administration
  name: IAM delivery and redrive policy administration
  compatibility: blocked
  summary: SNS policy attributes are accepted as no-ops and do not configure Azure delivery authorization or reliability.
  operations:
  - SetTopicAttributes
  - SetSubscriptionAttributes
  design_gaps:
  - No IAM-backed policy surface
  guidance: Configure authorization, retry, and dead-letter behavior directly on the Azure backend.
