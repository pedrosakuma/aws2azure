service: sns
operation: SetSubscriptionAttributes
azure_equivalent: Azure Service Bus subscription description
status: partial
verified_real_azure:
  date: '2026-07-22'
  evidence: https://github.com/pedrosakuma/aws2azure/actions/runs/29941293719
  workflow_run: https://github.com/pedrosakuma/aws2azure/actions/runs/29941293719
sub_features:
- name: UserMetadata attribute updates
  status: implemented
  notes: Performs a GET → merge → conditional PUT cycle against the Service Bus subscription description, persists FilterPolicy, FilterPolicyScope, and RawMessageDelivery inside UserMetadata as compact JSON, and upserts the default Service Bus subscription rule so the supported filter subset is enforced natively.
- name: Service Bus rule translation for supported filter policies
  status: partial
  disposition: feasible_backlog
  tracking_issue: '#800'
  notes: 'MessageAttributes scope translates supported SNS operators onto Service Bus SQL filters over mirrored application properties. MessageBody scope translates supported nested JSON object paths, including flat string-array leaves, onto reserved application properties stamped during Publish / PublishBatch. Beyond the original exact/prefix/exists/anything-but/numeric-range subset, this slice now also translates: (1) suffix matching, via a companion reversed LIKE clause plus the existing array-guard fallback; (2) equals-ignore-case matching, by stamping a lower-invariant companion property at publish time (Service Bus SQL filters have no UPPER/LOWER function, so case-folding happens at publish time rather than in the SQL expression); (3) IPv4 CIDR matching, by stamping a companion 32-bit-integer property for any string attribute or body leaf that parses as a dotted-quad IPv4 address, then translating the CIDR range into a numeric >=/<= comparison (Service Bus SQL has no bitwise operators, so this only works for IPv4 -- IPv6 CIDR is rejected as structurally unsupported); (4) MessageBody array matching for flat string arrays, by extending the same publish-time stamping used for MessageAttributes String.Array values to JSON body array fields (previously such fields were silently dropped and could never match).'
  gap: 'Genuinely inexpressible SNS operators remain rejected with InvalidParameter rather than silently accepted as unenforced: the nested anything-but-prefix form ({"anything-but": {"prefix": "..."}}), IPv6 CIDR matching (no 128-bit arithmetic in Service Bus SQL filters), and MessageBody arrays containing non-string elements (numbers, booleans, nested objects, or nested arrays) because there is no portable per-element numeric/boolean SQL comparison for JSON-array membership. Equals-ignore-case and IPv4 CIDR support are new in this slice and have unit-level coverage only; they are not yet verified against real Azure Service Bus (see the emulator caveat in AGENTS.md).'
- name: Compatibility no-ops
  status: implemented
  notes: Treats DeliveryPolicy, RedrivePolicy, and SubscriptionRoleArn as successful no-ops because this slice does not translate those SNS attributes onto Azure primitives.
behavior_differences:
- FilterPolicy is stored in UserMetadata and also translated onto the subscription's default Service Bus rule. MessageAttributes scope matches mirrored application properties; MessageBody scope matches scalar and flat-string-array JSON body fields projected into reserved application properties during Publish / PublishBatch.
- Suffix and equals-ignore-case matchers are translated onto companion reversed-LIKE / lower-invariant properties stamped at publish time; IPv4 CIDR matchers are translated onto a companion 32-bit-integer property and a numeric range comparison. None of these require a native Service Bus SQL function that doesn't exist (there is no UPPER/LOWER or bitwise arithmetic in Service Bus SQL filters), so all three are publish-time projections rather than SQL-native operators.
- Requests using unsupported SNS filter operators or shapes -- the nested anything-but-prefix form, IPv6 CIDR, and MessageBody arrays with non-string elements -- fail fast with InvalidParameter instead of being stored as unenforced metadata.
- DeliveryPolicy, RedrivePolicy, and SubscriptionRoleArn are accepted as no-ops because Service Bus does not expose a matching SNS attribute contract here.
- 'Updates preserve mutable SubscriptionDescription property XML, replace only UserMetadata, and send If-Match: * because Service Bus subscriptions do not expose usable per-entity ETags. Concurrent Azure-side writers are therefore last-write-wins; read-only runtime properties are never replayed.'
- Updates that would push the serialized UserMetadata payload beyond Service Bus's 1024-character limit are rejected with InvalidParameter.
- Updates whose translated Service Bus SQL expression would exceed the 1024-character Service Bus rule limit are rejected with InvalidParameter.
- Unknown AWS attribute names return InvalidParameter.
- Only Azure Service Bus subscription descriptions are updated; Azure Event Grid event-subscription properties are explicitly outside this profile.
- 'Real Azure has been observed (see #691) to reject the very first write to the reserved `$Default` subscription rule immediately after `Subscribe` in one specific conformance scenario, with an authorization-denied response carrying an empty body (`Server: Microsoft-HTTPAPI/2.0`, `Content-Length: 0`, an `ETag` header present). The failure is non-transient: it is immune to a bounded in-process retry, to a 60-second/6-attempt exponential backoff, and to an interleaved warm-up read on the same subscription before the write. Root cause is unconfirmed after extensive investigation (DELETE-vs-PUT sequencing, SAS-vs-AAD auth path, call ordering, propagation delay, an interleaved warm-up read, and the SAS resource-string encoding were all ruled out). This quirk is unrelated to the filter-translation work tracked in #800 and has not been re-investigated as part of it. The affected conformance test (`SnsRealAzureConformanceTests.cs`) skips rather than fails when this specific quirk reproduces, so it does not block CI while the gap remains open.'
