service: secretsmanager
operation: ListSecrets
azure_equivalent: GET https://{vault}.vault.azure.net/secrets?api-version=7.6
status: implemented
verified_real_azure:
  date: '2026-07-16'
  evidence: https://github.com/pedrosakuma/aws2azure/actions/runs/29473539261
  workflow_run: https://github.com/pedrosakuma/aws2azure/actions/runs/29473539261
behavior_differences:
- Initial MVP uses Key Vault AAD auth and translates the core secret CRUD/read paths to AWS Secrets Manager JSON responses.
- Advanced rotation, restore, and policy semantics are not yet modeled; the proxy uses Key Vault secret versions as the AWS version surface.
- Responses use the AWS JSON 1.1 wire shape (Unix-epoch numeric timestamps, Content-Type application/x-amz-json-1.1); validated end-to-end against a real Azure Key Vault through the proxy with the AWS SDK.
- SecretList entries emit Tags as an AWS Key/Value array and resolve the secret Name/ARN from the Key Vault item id; a JSON-map tag shape would desync the AWS SDK list unmarshaller.
- 'Pagination: AWS NextToken carries the Key Vault $skiptoken continuation value (and MaxResults maps to Key Vault maxresults); the proxy always rebuilds its own vault URI from the token rather than following an inbound URL, so NextToken cannot be used as an SSRF vector. Because the token is backend-specific and opaque, exact real-AWS-vs-real-Azure token bytes are intentionally non-comparable in the `list-secrets-pagination` Tier-3 offline diff. [conformance:list-secrets-pagination::field-value:NextToken]'
- ListSecrets exposes the whole active Key Vault secret inventory for the binding; it does not synthesize an isolated AWS-sized catalog. In the `list-secrets-pagination` Tier-3 case, the independently captured Azure-backed vault can legitimately still have additional unrelated secrets after page 2 even when the compared AWS capture stopped there, so that case allow-lists only an extra follow-up `NextToken` on page 2 rather than treating it as a proxy bug. [conformance:list-secrets-pagination::extra-field:NextToken]
- Filters, SortBy, SortOrder, and IncludePlannedDeletion are currently ignored. The proxy forwards only NextToken and MaxResults to Key Vault's list API and returns the unfiltered active-secret inventory.
references:
- https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_ListSecrets.html
- https://learn.microsoft.com/rest/api/keyvault/secrets/get-secret-properties-versions
