service: secretsmanager
design_gaps:
- area: Versioning and staging modelled on Key Vault version tags
  status: partial
  summary: Secrets Manager version stages (AWSCURRENT / AWSPREVIOUS / custom labels) are modelled with Key Vault secret versions plus per-version tags. Key Vault's created timestamp has one-second granularity, so deterministic resolution uses created time plus version id and relies on tag bookkeeping rather than a native staging concept.
  impact: Version creation, inventory, and per-version tag patches cannot be one Key Vault transaction. The proxy uses empty-stage creation, loser-first publication, fresh tag merges, and bounded verification/repair, but strict cross-instance atomicity remains structurally impossible without an external coordinator. Key Vault secret PATCH does not expose a contractual ETag/If-Match primitive, so a tag edit that lands in the narrow interval between the proxy's fresh GET and PATCH can still be overwritten.
  workaround: Retry an explicit ResourceExistsException after propagation settles and use a single writer when stronger ordering is required. Unrelated out-of-band tags are preserved by fresh merges, but out-of-band edits to proxy-owned aws2azure-* tags are unsupported. Before rollback, drain writes and let the candidate runtime finish or repair every pending publication; the previous runtime can read completed versions but cannot interpret the candidate-only pending-publication intent metadata. The current Tier-3 real-diff happy-path captures also cannot compare exact `VersionId` bytes for the existing create/get/update/describe/list round-trips because each real-AWS capture and each real-Azure evidence export generates fresh idempotency tokens / Key Vault versions in an independent run; the conformance gate therefore still compares presence/shape and same-step semantics, but treats those exact values as intentionally non-matchable.
  disposition: by_design
- area: Rotation has no Lambda equivalent
  status: partial
  summary: Secrets Manager rotation is driven by a customer Lambda function; Azure Key Vault has no equivalent in-line rotation-function contract, so RotateSecret cannot execute an arbitrary rotation workflow.
  impact: Automatic, function-driven credential rotation as configured in AWS is not reproduced end-to-end.
  workaround: Rotate secrets via an external process (e.g. an Azure Function / pipeline) that calls PutSecretValue through the proxy.
  disposition: non_goal
- area: Deletion recovery semantics differ
  status: by_design
  summary: DeleteSecret's RecoveryWindowInDays / ForceDeleteWithoutRecovery map onto Key Vault soft-delete and purge, whose retention model, purgeability, and reported deletion timestamps are governed by the vault rather than by AWS request parameters.
  impact: Recovery-window timing and force-delete behaviour follow the Key Vault soft-delete configuration rather than the exact AWS window semantics. If purge protection is enabled, ForceDeleteWithoutRecovery cannot succeed until the retention window expires regardless of RBAC role or access-policy grants. DescribeSecret also leaves deletion timestamps empty until deletion is actually initiated; it does not predict a future DeletionDate from the vault's recoverable-days setting.
  workaround: Configure the Key Vault soft-delete retention to match the intended recovery window. Use ForceDeleteWithoutRecovery only on vaults where purge protection is disabled and the configured identity has purge permission; there is no Azure permission level that overrides purge protection during the retention window.
  references:
  - https://learn.microsoft.com/en-us/azure/key-vault/general/soft-delete-overview#purge-protection
- area: Managed HSM endpoints do not implement the secrets API
  status: unsupported
  summary: Azure Managed HSM stores and serves keys only. It does not expose the Key Vault secrets or certificates data-plane APIs that aws2azure's Secrets Manager translation requires.
  impact: Pointing the Secrets Manager backend at a `*.managedhsm.azure.net` endpoint cannot work, even though the URL shape resembles a Key Vault hostname.
  workaround: Use a standard Azure Key Vault vault endpoint for Secrets Manager bindings. Startup validation rejects Managed HSM URLs with a clear configuration error instead of failing later at runtime.
  disposition: by_design
- area: Certificate-backed secrets require the certificate API for deletion
  status: partial
  summary: "Azure Key Vault marks certificate-backed secrets as `managed: true` and rejects `DELETE /secrets/{name}` with HTTP 405. AWS Secrets Manager does not expose that certificate distinction on DeleteSecret."
  impact: A caller can request DeleteSecret for a certificate-backed secret name and receive a failure even though the same name looks like a normal secret in list/describe flows.
  workaround: Delete the backing certificate through the Azure Key Vault certificate API or portal. aws2azure returns InvalidRequestException with a certificate-specific message when this backend rule is hit.
  disposition: by_design
- area: Disabled Key Vault secret versions use a backend-specific 403
  status: by_design
  summary: Key Vault returns HTTP 403 `Forbidden` with the message `Operation is disabled for this secret version.` when a secret version is disabled, whereas AWS callers expect disabled or deprecated versions to behave like not found during rotation fallback.
  impact: Without a targeted translation layer, SDK rotation code that catches ResourceNotFoundException and falls back to an older version would stop on an AccessDeniedException instead.
  workaround: aws2azure remaps only that exact disabled-version signature to ResourceNotFoundException. Other 403 responses still mean authorization failed and must be fixed in Azure RBAC or Key Vault access policy.
  disposition: by_design
- area: Synthetic ARNs use a proxy-specific namespace
  status: by_design
  summary: The proxy has no real AWS region/account/random-suffix identity for an Azure Key Vault secret, so it emits a synthetic `arn:aws:secretsmanager:azure:keyvault:secret:{name}` shape and parses any inbound ARN by taking the segment after `:secret:`.
  impact: Callers that validate exact AWS ARN region/account/suffix structure, persist AWS account IDs from ARNs, or depend on partial-ARN matching edge cases can observe non-AWS shapes. Offline Tier-3 diffs between independently captured real AWS and real Azure evidence therefore cannot use exact ARN byte equality as a meaningful gate signal.
  workaround: Treat the returned ARN as an opaque proxy identifier and prefer friendly secret names or full proxy-emitted ARNs when making subsequent requests.
  disposition: by_design
- area: No resource policies or cross-account access
  status: unsupported
  summary: Secrets Manager resource policies and cross-account secret sharing have no Key Vault equivalent in the wire-protocol path; authorization is the static AWS-key-to-Azure-credential mapping, not server-side IAM.
  impact: Policy-based or cross-account access patterns cannot be expressed through the proxy.
  workaround: Use Key Vault RBAC / access policies at the Azure level for authorization. For write/delete lifecycle workloads, grant the proxy identity a data-plane role such as Key Vault Secrets Officer; Key Vault Secrets User is read-only, and Key Vault Reader / Key Vault Contributor do not grant secret-value data-plane access. In legacy access-policy mode, grant the secrets get/set/list/delete permissions (plus purge only when purge protection is disabled and force-delete is intentionally allowed).
  references:
  - https://learn.microsoft.com/en-us/azure/key-vault/general/rbac-guide
  - https://learn.microsoft.com/en-us/azure/key-vault/general/assign-access-policy
  disposition: by_design
workload_patterns:
- id: secretsmanager_basic_lifecycle
  name: Basic secret lifecycle
  compatibility: conditional
  summary: Create, inspect, retrieve, update, list, and delete secrets through the corresponding Key Vault data-plane APIs.
  operations:
  - CreateSecret
  - DescribeSecret
  - GetSecretValue
  - UpdateSecret
  - ListSecrets
  - DeleteSecret
  design_gaps:
  - Deletion recovery semantics differ
  - Managed HSM endpoints do not implement the secrets API
  guidance: Suitable after configuring Entra ID authentication, granting the proxy identity the required Key Vault data-plane permissions (typically Key Vault Secrets Officer for this read/write/delete profile), and validating Key Vault soft-delete behavior for the deployment. Key Vault Secrets User is read-only, while Key Vault Reader and Key Vault Contributor do not grant secret-value access.
- id: secretsmanager_version_stages
  name: Version stages
  compatibility: conditional
  summary: AWS version stages are represented through Key Vault versions and tags rather than a native staging model.
  operations:
  - PutSecretValue
  - GetSecretValue
  - UpdateSecret
  design_gaps:
  - Versioning and staging modelled on Key Vault version tags
  guidance: Do not edit proxy-owned aws2azure-* tags; test rapid successive writes and handle bounded ResourceExistsException conflicts.
- id: secretsmanager_lambda_rotation
  name: Lambda-driven managed rotation
  compatibility: blocked
  summary: RotateSecret cannot execute an AWS Lambda-compatible rotation workflow.
  operations:
  - RotateSecret
  design_gaps:
  - Rotation has no Lambda equivalent
  guidance: Run rotation from an external Azure Function or pipeline that writes the new version through the proxy.
- id: secretsmanager_resource_policies
  name: Resource policies and cross-account sharing
  compatibility: blocked
  summary: Secrets Manager resource-policy and cross-account authorization semantics are not exposed.
  design_gaps:
  - No resource policies or cross-account access
  guidance: Use Key Vault RBAC and separate bindings to enforce access.
