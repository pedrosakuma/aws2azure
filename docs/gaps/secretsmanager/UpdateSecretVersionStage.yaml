service: secretsmanager
operation: UpdateSecretVersionStage
azure_equivalent: None — no standalone Key Vault stage-label mutation API
status: unsupported
sub_features:
- name: Standalone stage-label mutation API
  status: unsupported
  notes: The proxy models AWS staging labels through Key Vault version tags for PutSecretValue, UpdateSecret, GetSecretValue, and DescribeSecret, but it does not expose the standalone UpdateSecretVersionStage contract. Requests are recognised by the router for metrics and rejected before any backend call.
  disposition: by_design
behavior_differences:
- Returns HTTP 501 with an AWS `NotImplementedException` error shape. The operation is recognised by the wire-protocol router and KnownOperations allowlist, but aws2azure does not implement the standalone label-mutation API.
references:
- https://docs.aws.amazon.com/secretsmanager/latest/apireference/API_UpdateSecretVersionStage.html
disposition: by_design
