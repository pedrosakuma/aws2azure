service: s3
operation: ListObjects
azure_equivalent: GET https://{account}.blob.core.windows.net/{container}?restype=container&comp=list
status: implemented
verified_real_azure:
  date: '2026-08-11'
  evidence: https://github.com/pedrosakuma/aws2azure/actions/runs/31447675330
  workflow_run: https://github.com/pedrosakuma/aws2azure/actions/runs/31447675330
sub_features:
- name: prefix
  status: implemented
- name: delimiter (CommonPrefixes via Azure BlobPrefix)
  status: implemented
- name: marker / NextMarker
  status: implemented
  gap: S3 V1 only emits NextMarker when a delimiter is set; we follow that contract.
- name: max-keys (default 1000, cap 1000)
  status: implemented
- name: encoding-type=url
  status: implemented
behavior_differences:
- Legacy V1 listing kept alongside V2 for SDKs that have not migrated.
- Without a delimiter, callers derive the next marker from the last Contents.Key (matches S3 docs).
- x-amz-bucket-region is not emitted on ListObjects responses; Azure's List Blobs response does not carry an equivalent region indicator, and the proxy does not synthesize one for the listing path (HeadBucket is the surface that carries region). [conformance:list-objects-v1-pagination::missing-header:x-amz-bucket-region]
- NextMarker / Marker use a proxy-defined opaque encoding of Azure's continuation token when a delimiter is set (mirroring ListObjectsV2's opaque continuation-token semantics) rather than AWS's "last returned key" convention; clients must round-trip the exact value across page boundaries. [conformance:list-objects-v1-pagination::field-value:NextMarker] [conformance:list-objects-v1-pagination::field-value:Marker]
references:
- https://docs.aws.amazon.com/AmazonS3/latest/API/API_ListObjects.html
- https://learn.microsoft.com/rest/api/storageservices/list-blobs
