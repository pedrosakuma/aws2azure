service: s3
operation: CreateMultipartUpload
azure_equivalent: HEAD container + proxy-owned durable multipart state record
status: implemented
verified_real_azure:
  date: '2026-08-11'
  evidence: https://github.com/pedrosakuma/aws2azure/actions/runs/31447675330
  workflow_run: https://github.com/pedrosakuma/aws2azure/actions/runs/31447675330
sub_features:
- name: durable-state-record
  status: implemented
  notes: The proxy writes one bounded state blob per active upload into its hidden aws2azure-mpu-<account-hash> container. The record captures Content-Type/Content-Encoding/Content-Language/Content-Disposition/Cache-Control and x-amz-meta-* headers (16 KiB cap) so CompleteMultipartUpload can apply them to the committed blob.
- name: bucket-generation-binding
  status: implemented
  notes: CreateMultipartUpload captures the destination container ETag before writing the state record, stores it in record metadata, then re-verifies the ETag after the write. If the bucket was deleted/recreated mid-request the proxy deletes the just-written record and returns 409 OperationAborted.
- name: server-side-encryption
  status: unsupported
  notes: x-amz-server-side-encryption* request headers are ignored. Encryption remains governed by the destination storage account.
  disposition: by_design
- name: object-tagging
  status: implemented
  notes: >-
    x-amz-tagging on initiate is parsed as a URL-encoded query-string of
    key=value pairs (the same wire shape PutObjectTagging's XML body
    encodes), validated against the same limits as PutObjectTagging (max 10
    tags, key <=128 bytes, value <=256 bytes), and persisted alongside
    Content-Type/x-amz-meta-* in the durable-state-record. Once
    CompleteMultipartUpload's Put Block List commit succeeds, the proxy
    issues a second Azure call (Set Blob Tags, PUT {blob}?comp=tags) to apply
    the captured tags to the finalized blob. Verified against Azurite, which
    implements Blob Index Tags for objects (see PutObjectTagging's
    integration coverage). Real-Azure verification of this specific
    sub-feature is still pending — the operation-level verified_real_azure
    block above predates #799 and does not cover object-tagging.
- name: object-lock
  status: unsupported
  disposition: by_design
- name: storage-class
  status: unsupported
  notes: x-amz-storage-class is ignored; Azure uses the account/container defaults.
  disposition: by_design
behavior_differences:
- 'UploadId remains a 32-byte base64url token HMAC-bound to (account, bucket, key) and expiring after 7 days, but multipart is no longer purely stateless: a proxy-owned durable index record is also created so in-progress uploads can be enumerated and later completed with the original metadata.'
- Initiation fails with InvalidArgument when the captured metadata/property headers would exceed the 16 KiB durable-state cap.
- The hidden multipart-state container is internal-only and not reachable through S3 bucket routes or copy-source headers.
- x-amz-server-side-encryption is not emitted on the CreateMultipartUpload response; Azure Blob Storage's HEAD container response reports encryption state via x-ms-server-encrypted rather than a header the proxy currently mirrors onto initiate 200s, and no request-time server-side-encryption headers are honoured (see sub_features). [conformance:multipart-upload-abort-roundtrip::missing-header:x-amz-server-side-encryption] [conformance:multipart-upload-copy-complete-roundtrip::missing-header:x-amz-server-side-encryption]
- Echoed <Bucket> and <UploadId> in the initiate response are the destination container name and the proxy-issued opaque UploadId token; the offline Tier-3 diff compares captures against independently seeded buckets and independently issued upload ids, so those echoed values cannot match byte-for-byte across capture runs. [conformance:multipart-upload-abort-roundtrip::field-value:Bucket] [conformance:multipart-upload-abort-roundtrip::field-value:UploadId] [conformance:multipart-upload-copy-complete-roundtrip::field-value:Bucket] [conformance:multipart-upload-copy-complete-roundtrip::field-value:UploadId]
- Applying x-amz-tagging (object-tagging sub-feature) is a second, non-atomic Azure call (Set Blob Tags) issued after CompleteMultipartUpload's block-list commit succeeds, unlike Content-Type/x-amz-meta-*, which ride along on the commit request itself. If Set Blob Tags fails, CompleteMultipartUpload returns an error even though the blob is already committed with its content and standard headers; the durable state record is left leased (not retired) rather than deleted, so the lease simply expires and a client retry of CompleteMultipartUpload can re-attempt tag application. The retry validates parts against both the committed and uncommitted block lists (not just uncommitted) so parts already committed by the prior attempt are recognized instead of spuriously failing with InvalidPart.
references:
- https://docs.aws.amazon.com/AmazonS3/latest/API/API_CreateMultipartUpload.html
- https://learn.microsoft.com/rest/api/storageservices/get-container-properties
