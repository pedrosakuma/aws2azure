service: s3
operation: PresignedUrl
azure_equivalent: (no operation — feature-flag; presigned URLs reuse GetObject / PutObject / HeadObject / DeleteObject paths)
status: implemented
verified_real_azure:
  date: '2026-08-11'
  evidence: https://github.com/pedrosakuma/aws2azure/actions/runs/31447675330
  workflow_run: https://github.com/pedrosakuma/aws2azure/actions/runs/31447675330
sub_features:
- name: Presigned GET
  status: implemented
  notes: Generated via boto3.generate_presigned_url('get_object', ...) or AWSSDK.S3 GetPreSignedURL with endpoint_url pointing at the proxy; the proxy validates the SigV4 signature and executes GetBlob against Azure.
- name: Presigned PUT
  status: implemented
  notes: Body integrity relies on TLS — SigV4 presigned PUT is signed with UNSIGNED-PAYLOAD on AWS too, so the proxy can only authenticate the request envelope (method, path, query, host, expiry).
- name: Presigned HEAD
  status: implemented
- name: Presigned DELETE
  status: implemented
- name: X-Amz-Expires window
  status: implemented
  notes: 'Enforced by SigV4Validator: integer in [1, 604800] seconds; clock skew of ±15 min tolerated for X-Amz-Date.'
- name: X-Amz-Security-Token (STS session credentials)
  status: unsupported
  gap: aws2azure does not implement STS — credentials are static config entries. If a client includes X-Amz-Security-Token in a presigned URL it is part of the canonical query (and therefore signature-protected), but aws2azure does not validate it as a session token.
  disposition: by_design
- name: Presigned POST (browser form uploads)
  status: implemented
  notes: Browser-style multipart/form-data POST policies are validated proxy-side from form fields and then uploaded to Azure as a normal Put Blob. success_action_status=201 and success_action_redirect remain unsupported.
- name: Presigned multipart upload subresources
  status: implemented
  notes: Presigned query authentication now has end-to-end coverage for ?uploads, UploadPart, and CompleteMultipartUpload.
- name: response-content-* query overrides
  status: implemented
  notes: Presigned GetObject requests honour the same response-content-* overrides as header-authenticated GetObject.
- name: Azure Blob SAS issuance / redirect mode
  status: unsupported
  gap: By design — aws2azure operates in proxy mode and never hands Azure SAS tokens to the client, so storage-account keys never leave the proxy. Clients always hit the proxy URL, not the Azure Blob endpoint.
  disposition: by_design
- name: Host-rewrite mode (opt-in)
  status: implemented
  notes: Opt-in via s3.presignedTrustedSigningHosts. A presigned URL signed against a trusted AWS S3 endpoint host and then host-rewritten to a path-style proxy request is re-validated against the listed origin host(s), covering both path-style (host = listed value) and virtual-hosted (host = {bucket}.{listed value}, bucket stripped from the path) origins. Empty (default) keeps strict host binding. The signature still requires the correct secret and every other signed parameter — only the host binding is relaxed to the allowlist. See docs/presigned-urls.md.
behavior_differences:
- By default (empty s3.presignedTrustedSigningHosts) presigned URLs MUST be signed against the proxy host (set the AWS SDK's endpoint_url / ServiceURL to the proxy). A URL signed against s3.amazonaws.com cannot be replayed at the proxy — the host is a signed header.
- Opt-in host-rewrite mode (s3.presignedTrustedSigningHosts) additionally accepts presigned URLs signed against listed AWS origin hosts and rewritten to a path-style proxy request; see docs/presigned-urls.md for the per-topology tradeoffs.
- 'The proxy operates in ''Option A — proxy mode'': it validates the presigned signature, then proxies the operation to Azure Blob using its configured Azure credentials. No Azure SAS is returned or redirected.'
- Body content for presigned PUT is not signature-protected (UNSIGNED-PAYLOAD) — identical to AWS S3 semantics.
- Tampering with any signed query parameter (including X-Amz-Date, X-Amz-Expires, X-Amz-Credential, X-Amz-SignedHeaders, or the path/method) yields 403 SignatureDoesNotMatch.
- Expired URLs (now > X-Amz-Date + X-Amz-Expires) yield 403 AccessDenied (mirrors S3's 'Request has expired' error).
- Real S3 emits a rich diagnostic RequestTimeTooSkewed <Error> body carrying <MaxAllowedSkewMilliseconds>, <RequestTime>, and <ServerTime> to help clients compute a clock-skew correction. The proxy's SigV4 rejection envelope carries only the mandatory <Code> + <RequestId> because SDK clock-skew retries derive their correction from the response Date header (which the proxy does emit) rather than from these body fields, so their absence does not affect retry behavior. [conformance:request-time-too-skewed::missing-field:MaxAllowedSkewMilliseconds] [conformance:request-time-too-skewed::missing-field:RequestTime] [conformance:request-time-too-skewed::missing-field:ServerTime]
- The InvalidAccessKeyId <Error> envelope real S3 emits echoes the offending <AWSAccessKeyId>; the proxy's shared SigV4-failure envelope does not carry the access-key back into the body. Clients read the same information from the request they just sent, so retry/failure semantics are unaffected. [conformance:invalid-access-key-id::missing-field:AWSAccessKeyId]
- The SignatureDoesNotMatch <Error> envelope real S3 emits includes several diagnostic fields — <AWSAccessKeyId>, <StringToSign>, <StringToSignBytes>, <CanonicalRequest>, <CanonicalRequestBytes>, <SignatureProvided> — echoing the client-computed signing inputs to help debug canonicalisation drift. The proxy's SigV4 failure envelope keeps only <Code> + <RequestId> to keep the hot rejection path allocation-free; AWS SDKs do not consume these diagnostic fields for retry logic, so their absence has no functional impact. [conformance:signature-does-not-match::missing-field:AWSAccessKeyId] [conformance:signature-does-not-match::missing-field:CanonicalRequest] [conformance:signature-does-not-match::missing-field:CanonicalRequestBytes] [conformance:signature-does-not-match::missing-field:SignatureProvided] [conformance:signature-does-not-match::missing-field:StringToSign] [conformance:signature-does-not-match::missing-field:StringToSignBytes]
