service: dynamodb
operation: TransactWriteItems
azure_equivalent: "Azure Cosmos DB (Core SQL API) — single-partition stored-procedure transaction"
status: partial
sub_features:
  - name: Atomic Put / Delete / ConditionCheck
    status: implemented
    notes: >-
      `atomicTransactWrite_v4` reads and validates every target before issuing
      writes. All writes execute inside one Cosmos logical-partition ACID
      transaction; a condition or write failure commits nothing.
      `atomicTransactWrite_v2` remains in the persisted-format inventory, but its
      runtime is not compatible with the complete transaction workload profile
      and is not an approved rollback baseline.
  - name: ConditionExpression transaction subset
    status: implemented
    notes: >-
      Conditions are prevalidated before stored-procedure invocation. Supported:
      AND/OR/NOT, scalar comparisons with one path and one literal in either
      operand order, string BETWEEN, IN,
      attribute_exists, attribute_not_exists, begins_with, and attribute_type
      for S/BOOL/NULL. Paths must be one non-reserved top-level attribute and
      cannot name Cosmos system fields such as `_etag` or `_ts`.
      Values must be S, BOOL, NULL, or an N whose canonical form the persisted
      codec stores as a bare JSON number. Numbers are limited to
      equality/not-equal and IN; any number stored in an `_a2a:N` envelope is
      rejected before execution. Ordered string comparisons use DynamoDB's exact
      UTF-8 byte lexicographic order, including supplementary Unicode code
      points. Missing attributes never satisfy `<>`; differing DynamoDB types
      do. Runtime type errors for ordered operators, BETWEEN, and begins_with
      are returned as a structured script validation result and mapped to
      ValidationException; NOT never turns such an error into success. Unknown
      AST nodes fail closed.
  - name: Unsupported condition forms fail closed
    status: implemented
    notes: >-
      Maps/lists, sets, binary, enveloped numbers, nested or
      list-index paths, dotted attribute names, path-to-path comparisons,
      contains(), size(), and unsupported attribute_type tags are rejected with
      ValidationException. Legacy Expected/ConditionalOperator are rejected
      instead of ignored.
  - name: AttributeValue and placeholder preflight
    status: implemented
    notes: >-
      Every Put item, Delete/ConditionCheck key, and condition value is validated
      before table metadata or stored-procedure I/O. Empty sets, malformed
      base64, invalid/out-of-range Number values and Number-set members,
      duplicate set members, and malformed typed shapes are rejected.
      Non-empty string sets may contain an empty string, matching current
      DynamoDB policy. Every declared ExpressionAttributeNames and
      ExpressionAttributeValues placeholder must be consumed. IN lists are
      capped at DynamoDB's 100 operands before any metadata or script I/O.
  - name: Positional CancellationReasons
    status: implemented
    notes: >-
      A failed condition returns exactly one aligned reason per TransactItem.
      Only None and ConditionalCheckFailed are accepted from the versioned
      script. Missing, extra, unknown, or unjustified reasons fail closed as an
      internal protocol error.
  - name: Update
    status: unsupported
    notes: >-
      Atomic transactional UpdateExpression is rejected with
      ValidationException. Use Put to replace the complete item.
  - name: 100-item-per-call cap
    status: implemented
    notes: "Requests over 100 items are rejected with ValidationException."
  - name: Serialized transaction body limit
    status: partial
    notes: >-
      The exact UTF-8 stored-procedure parameter body is assembled once in a
      pooled buffer and must not exceed Cosmos DB's 2 MiB request boundary.
      Oversize requests are rejected deterministically with ValidationException
      before stored-procedure provisioning or execution. DynamoDB permits an
      aggregate 4 MiB transaction, so the proxy's accepted aggregate is lower.
  - name: ClientRequestToken (idempotency)
    status: implemented
    notes: >-
      Tokens are validated at 1–36 characters. `atomicTransactWrite_v4` writes a
      collision-proof reserved record in the same Cosmos logical partition and
      transaction as the user writes. Its stable SHA-256 fingerprint is based on
      normalized transaction semantics: resolved condition ASTs, canonical
      DynamoDB numbers/base64, sorted map properties and set members, and the
      ordered operation list, so JSON property order and equivalent numeric/set
      encodings do not cause false mismatches. Equivalent retries replay the
      original success or positional condition-cancellation outcome without
      applying writes again; a different fingerprint within the active window
      returns IdempotentParameterMismatchException. The script uses Cosmos server
      time for a 10-minute logical window, records created/expiry timestamps,
      assigns a 660-second native ttl, and performs a bounded partition-local
      sweep when container TTL is not armed. Expired records are safely replaced.
      Preflight and script validation errors are not cached. The contract is
      scoped to this operation's supported single-table/single-partition boundary;
      callers must not reuse one token for a transaction in another partition.
  - name: ReturnValuesOnConditionCheckFailure
    status: unsupported
    notes: >-
      Any use is rejected with ValidationException; ALL_OLD items are not
      fabricated or silently omitted.
  - name: ReturnConsumedCapacity / ReturnItemCollectionMetrics
    status: unsupported
    notes: >-
      Omitted or NONE is accepted. Other values are rejected with
      ValidationException rather than silently dropping response fields.
behavior_differences:
  - "**Single table + single partition key only.** Cross-table and cross-partition operations are rejected before item data is read or a transaction stored procedure is invoked."
  - "Duplicate operations on the same table/key are rejected with ValidationException before execution."
  - "Stored procedures must be enabled (Preferred or Required). There is no non-atomic fallback."
  - "Stored-procedure provisioning treats an HTTP 409 as success only after reading the existing resource and verifying the exact versioned id and body; an id/body conflict fails closed."
  - "Transaction execution POSTs retain the no-automatic-retry transport option. Token-bearing requests explicitly retry only Cosmos write-conflict statuses once; any caller retry after an ambiguous/lost response is safe because the token outcome is committed atomically with the writes. Tokenless requests remain non-retried. Stored-procedure availability is cached per Cosmos account/database/container, invalidated on table lifecycle, and evicted/reprovisioned once after an execution 404."
  - "`atomicWrite_v2`, `atomicTransactWrite_v2`, and `atomicTransactWrite_v3` remain frozen in the additive persisted-format identity set. The current durable idempotency contract uses `atomicTransactWrite_v4`; TransactGet uses `atomicTransactGet_v1`."
  - "The Cosmos Linux emulator cannot execute these scripts. V4 write/idempotency semantics, v1 snapshots, contention, restart, and exact-body conflict handling require fresh real-Azure runs before new seals are committed."
  - "No trusted prior release implements the complete profile: the known v2 runtime uses independent reads and lacks the durable ClientRequestToken contract. It is not an approved bootstrap/rollback target; qualification is rollout-only and records the adjacent-runtime row as skipped/inconclusive until a compatible prior release exists."
  - "The exact serialized stored-procedure parameter body is limited to 2 MiB, below DynamoDB's 4 MiB aggregate TransactWriteItems limit. Oversize requests fail with ValidationException before stored-procedure I/O."
references:
  - https://docs.aws.amazon.com/amazondynamodb/latest/APIReference/API_TransactWriteItems.html
  - https://learn.microsoft.com/azure/cosmos-db/nosql/database-transactions-optimistic-concurrency
  - https://learn.microsoft.com/azure/cosmos-db/nosql/stored-procedures-triggers-udfs
  - https://learn.microsoft.com/azure/cosmos-db/concepts-limits
