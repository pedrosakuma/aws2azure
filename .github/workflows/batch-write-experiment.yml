name: batch-write-experiment

on:
  workflow_dispatch:
    inputs:
      cells:
        description: 'Up to sixteen staged size:concurrency:put|delete|mixed:shared|distinct:proxy|direct cells, separated by spaces'
        required: true
        default: '25:8:put:distinct:proxy 25:8:put:distinct:direct'
      baseline:
        description: 'Baseline source revision, resolved once before publishing'
        required: true
        default: 'origin/main'
      candidate:
        description: 'Candidate source revision (empty uses harness HEAD; equal pins give explicit A/A repetitions)'
        required: false
      image:
        description: 'Pinned Cosmos emulator repository digest'
        required: true
        default: 'mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:2db1f9e74c506bcf6fc347aa937aea1c00fa756061296a5a9efba530ce86ec02'
  pull_request:
    paths:
      - 'tests/Aws2Azure.PerfTests/DynamoDb/BatchWriteExperiment*.cs'
      - '.github/workflows/batch-write-experiment.yml'
      - 'eng/publish-batch-runtime.sh'
      - 'src/Aws2Azure.Modules.DynamoDb/Operations/BatchWrite*.cs'

permissions:
  contents: read

concurrency:
  group: batch-write-experiment-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/dotnet-setup
      - name: Build before measurement
        env:
          BASELINE: ${{ inputs.baseline || 'origin/main' }}
          CANDIDATE: ${{ inputs.candidate || 'HEAD' }}
          EMULATOR_IMAGE: ${{ inputs.image || 'mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:2db1f9e74c506bcf6fc347aa937aea1c00fa756061296a5a9efba530ce86ec02' }}
        run: |
          set -euo pipefail
          dotnet build tests/Aws2Azure.PerfTests -c Release --nologo
          bash eng/publish-batch-runtime.sh "$BASELINE" artifacts/batch-runtimes/main
          bash eng/publish-batch-runtime.sh "$CANDIDATE" artifacts/batch-runtimes/candidate
          if [[ ! "$EMULATOR_IMAGE" =~ ^mcr[.]microsoft[.]com/cosmosdb/linux/azure-cosmos-emulator@sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Select a pinned Cosmos emulator repository digest."
            exit 1
          fi
          docker pull "$EMULATOR_IMAGE"
          echo "AWS2AZURE_BATCH_IMAGE=$EMULATOR_IMAGE" >> "$GITHUB_ENV"
      - name: Record host and run serial cells
        env:
          SELECTED_CELLS: ${{ inputs.cells || '25:8:put:distinct:proxy 25:8:put:distinct:direct' }}
          AWS2AZURE_BATCH_EXPERIMENT: '1'
          AWS2AZURE_BATCH_EXCLUSIVE_HOST: '1'
          AWS2AZURE_BATCH_OUTPUT: ${{ github.workspace }}/artifacts/batch-write
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$AWS2AZURE_BATCH_OUTPUT"
          docker info > "$AWS2AZURE_BATCH_OUTPUT/docker-info.txt"
          lscpu > "$AWS2AZURE_BATCH_OUTPUT/cpu.txt"
          git rev-parse HEAD > "$AWS2AZURE_BATCH_OUTPUT/source.txt"
          read -r -a cells <<< "$SELECTED_CELLS"
          if (( ${#cells[@]} < 1 || ${#cells[@]} > 16 )); then
            echo "::error::Select between one and sixteen staged cells."
            exit 1
          fi
          for runtime in main candidate; do
            export AWS2AZURE_BATCH_RUNTIME="$GITHUB_WORKSPACE/artifacts/batch-runtimes/$runtime"
            for cell in "${cells[@]}"; do
              label="$runtime-${cell//:/-}"
              ps -eo pid,comm,pcpu > "$AWS2AZURE_BATCH_OUTPUT/processes-$label.txt"
              docker ps --no-trunc > "$AWS2AZURE_BATCH_OUTPUT/containers-$label.txt"
              cat /proc/pressure/{cpu,memory,io} > "$AWS2AZURE_BATCH_OUTPUT/pressure-before-$label.txt"
              AWS2AZURE_BATCH_SLOT="$runtime" AWS2AZURE_BATCH_CELL="$cell" dotnet test tests/Aws2Azure.PerfTests \
                -c Release --no-build --nologo \
                --filter 'FullyQualifiedName~BatchWriteExperimentTests.Selected_cell_records_bounded_diagnostic'
              cat /proc/pressure/{cpu,memory,io} > "$AWS2AZURE_BATCH_OUTPUT/pressure-after-$label.txt"
            done
          done
      - name: Upload diagnostics, including failures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batch-write-diagnostic
          path: |
            artifacts/batch-write
            artifacts/batch-runtimes/*/runtime-identity.json
            artifacts/batch-runtimes/*/build-dotnet-info.txt
          if-no-files-found: warn
          retention-days: 30
