name: secretsmanager-concurrency-diagnostic

on:
  workflow_dispatch:
    inputs:
      candidate_digest:
        description: Exact approved RC5 candidate aggregate digest, unchanged across all slots
        required: true
        default: sha256:32767e07b62b1e0f1bfa1b05500efa4e008bb93ec2fc6e85f59521f2f443e322
        type: string
      budget_confirmed:
        description: Operator confirmed remaining cumulative Azure budget for this one diagnostic
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  attestations: read
  id-token: write

concurrency:
  group: integration-real-azure
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PROFILE: secretsmanager-basic-lifecycle
      AZURE_LOCATION: eastus2
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_OBJECT_ID: ${{ secrets.AZURE_CLIENT_OBJECT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      RG_NAME: aws2azure-secrets-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
      OUTPUT_DIR: artifacts/secretsmanager-concurrency
      AWS2AZURE_SECRETS_CONCURRENCY_REPORT_PATH: artifacts/secretsmanager-concurrency/report.json
      AWS2AZURE_SECRETS_CONCURRENCY_DIGEST: ${{ inputs.candidate_digest }}
      AWS2AZURE_SEALED_RUNTIME_MODE: candidate
      AWS2AZURE_QUALIFICATION_MODE: reaffirm
      AWS2AZURE_QUALIFICATION_PROFILE: secretsmanager-basic-lifecycle
      AWS2AZURE_QUALIFICATION_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - name: Require protected main and explicit budget acknowledgement
        env:
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
          BUDGET_CONFIRMED: ${{ inputs.budget_confirmed }}
        run: |
          set -euo pipefail
          if [ "$REF" != refs/heads/main ] || [ "$REF_PROTECTED" != true ] ||
             [ "$BUDGET_CONFIRMED" != true ]; then
            echo "::error::This billed diagnostic requires protected main and explicit budget acknowledgement."
            exit 1
          fi
          if [[ ! "$AWS2AZURE_SECRETS_CONCURRENCY_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] ||
             [ -z "$AZURE_CLIENT_ID" ] || [ -z "$AZURE_CLIENT_OBJECT_ID" ] || [ -z "$AZURE_TENANT_ID" ]; then
            echo "::error::Exact runtime digest and workload identity configuration are required."
            exit 1
          fi
          echo "PRIVATE_DIR=$RUNNER_TEMP/aws2azure-secrets-concurrency-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - uses: ./.github/actions/dotnet-setup
      - name: Build harness and validate authoritative inputs before provisioning
        run: |
          dotnet build -c Release --nologo
          dotnet exec tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll --validate
      - name: Resolve and pin the exact sealed candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$PRIVATE_DIR"
          mkdir -p "$OUTPUT_DIR"
          dotnet exec tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll \
            export-approved-runtime --profile "$PROFILE" --output "$PRIVATE_DIR/current-ledger.json"
          jq -e --arg expected "$AWS2AZURE_SECRETS_CONCURRENCY_DIGEST" \
            '.record.runtime.aggregate_digest == $expected' "$PRIVATE_DIR/current-ledger.json" >/dev/null
          candidate_run="$(jq -er '.record.producer.run_id' "$PRIVATE_DIR/current-ledger.json")"
          candidate_attempt="$(jq -er '.record.producer.run_attempt' "$PRIVATE_DIR/current-ledger.json")"
          candidate_sha="$(jq -er '.record.runtime.source_sha' "$PRIVATE_DIR/current-ledger.json")"
          candidate_ref="$(jq -er '.record.attestation.source_ref' "$PRIVATE_DIR/current-ledger.json")"
          candidate_artifact="$(jq -er '.record.artifact.id' "$PRIVATE_DIR/current-ledger.json")"
          bash eng/resolve-sealed-runtime.sh \
            --repository "$GITHUB_REPOSITORY" --run-id "$candidate_run" --run-attempt "$candidate_attempt" \
            --expected-sha "$candidate_sha" --expected-ref "$candidate_ref" \
            --profile "$PROFILE" --profile-version 1 --role candidate --artifact-id "$candidate_artifact" \
            --destination "$PRIVATE_DIR/candidate" --identity-output "$PRIVATE_DIR/candidate.json" \
            --github-env "$GITHUB_ENV"
          jq -e --arg expected "$AWS2AZURE_SECRETS_CONCURRENCY_DIGEST" \
            '.runtime.aggregate_digest == $expected' "$PRIVATE_DIR/candidate.json" >/dev/null
          jq -n --arg source "$GITHUB_SHA" --slurpfile candidate "$PRIVATE_DIR/candidate.json" \
            '{schema_version:1, promotable:false, harness_source_sha:$source,
              candidate:$candidate[0]}' > "$OUTPUT_DIR/sealed-inputs.json"
      - name: Azure login (OIDC)
        id: azure
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Provision one dedicated Key Vault without provisioning retries
        timeout-minutes: 20
        run: |
          set -euo pipefail
          az group create -n "$RG_NAME" -l "$AZURE_LOCATION" \
            --tags purpose=aws2azure-nightly diagnostic=secretsmanager-concurrency \
              run-id="$GITHUB_RUN_ID" created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o none
          az deployment group create -g "$RG_NAME" -n concurrency \
            -f deploy/realazure/secretsmanager-load.bicep \
            -p bootstrapPrincipalId="$AZURE_CLIENT_OBJECT_ID" deployStableVault=false -o none
          endpoint="$(az deployment group show -g "$RG_NAME" -n concurrency \
            --query properties.outputs.keyVaultUri.value -o tsv)"
          name="$(az deployment group show -g "$RG_NAME" -n concurrency \
            --query properties.outputs.keyVaultName.value -o tsv)"
          if [ -z "$endpoint" ] || [ -z "$name" ]; then
            echo "::error::Incomplete Key Vault configuration."
            exit 1
          fi
          echo "AZURE_KEYVAULT_URL=$endpoint" >> "$GITHUB_ENV"
          echo "DIAGNOSTIC_VAULT_NAME=$name" >> "$GITHUB_ENV"
          ready=false
          for _ in $(seq 1 30); do
            if az keyvault secret list --vault-name "$name" --maxresults 1 -o none 2>/dev/null; then
              ready=true
              break
            fi
            sleep 10
          done
          if [ "$ready" != true ]; then
            echo "::error::Key Vault RBAC did not become ready within five minutes."
            exit 1
          fi
      - name: Project the short-lived OIDC assertion privately
        run: |
          set -euo pipefail
          token_file="$PRIVATE_DIR/azure-federated-token.jwt"
          (
            umask 077
            curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" |
              python3 -c 'import json,pathlib,sys; value=json.load(sys.stdin).get("value"); assert value; pathlib.Path(sys.argv[1]).write_text(value)' "$token_file"
          )
          chmod 0600 "$token_file"
          echo "AZURE_FEDERATED_TOKEN_FILE=$token_file" >> "$GITHUB_ENV"
      - name: Run five-eight-eight-five and five-five control
        timeout-minutes: 85
        run: |
          set -euo pipefail
          if ! dotnet test tests/Aws2Azure.IntegrationTests -c Release --no-build --nologo \
            --filter 'Category=SecretsManagerConcurrencyDiagnostic' > "$PRIVATE_DIR/harness.log" 2>&1; then
            echo "::error::Concurrency diagnostic failed. Inspect sanitized partial report; raw harness output remains private."
            exit 1
          fi
          jq -e '.schema_version == 1 and .promotable == false and .completed == true and
            (.slots | length) == 6 and ([.slots[].concurrency] == [5,8,8,5,5,5]) and
            all(.slots[]; .completed and .warmup.completed and .measurement.completed)' \
            "$AWS2AZURE_SECRETS_CONCURRENCY_REPORT_PATH" >/dev/null
      - name: Refresh Azure login for cleanup (OIDC)
        if: always() && steps.azure.outcome == 'success'
        timeout-minutes: 5
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deallocate the owned backend
        if: always() && steps.azure.outcome == 'success'
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # Capture names before deletion even when provisioning failed after vault creation.
          exists="$(az group exists -n "$RG_NAME" -o tsv)"
          vaults=''
          if [ "$exists" = true ]; then
            vaults="$(az keyvault list -g "$RG_NAME" --query '[].name' -o tsv)"
          elif [ "$exists" != false ]; then
            echo "::error::Could not determine owned group state."
            exit 1
          fi
          bash .github/scripts/cleanup-real-azure-resource-groups.sh "$RG_NAME"
          for vault in $vaults; do
            purged=false
            for _ in $(seq 1 12); do
              remaining="$(az keyvault list-deleted --resource-type vault \
                --query "[?name=='$vault'] | length(@)" -o tsv)"
              if [ "$remaining" = 0 ]; then
                purged=true
                break
              fi
              sleep 10
            done
            if [ "$purged" != true ]; then
              echo "::error::The owned Key Vault still has a soft-deleted reservation after cleanup."
              exit 1
            fi
          done
      - name: Retain non-promotable reports only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: diagnostic-secrets-concurrency-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/secretsmanager-concurrency/*.json
          if-no-files-found: warn
          retention-days: 90
