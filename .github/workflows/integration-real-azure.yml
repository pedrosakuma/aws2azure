name: integration-real-azure

# Real-Azure integration coverage and evidence for the service modules
# (issues #153, #257, #533).
#
# Emulators (Azurite, Service Bus / Event Hubs / Cosmos emulators) are
# necessary but NOT sufficient — they diverge from real Azure on auth,
# default ports, throttling and feature surface. This scheduled job runs
# the bounded six-service conformance matrix through the proxy against LIVE
# Azure, plus credential-independent deterministic failure checks, to catch
# real-Azure-only regressions (e.g. the AMQP port-defaulting bug fixed in
# 1560d11 that emulators never surfaced).
#
# Ephemeral provision -> test -> deallocate (issue #257): the job logs into
# Azure via OIDC (no stored client secret), provisions a per-run, uniquely
# named resource group from deploy/realazure/main.bicep, exports the freshly
# minted connection details into the test environment, runs the real-Azure
# suite, generates TRX-backed evidence, then deletes the resource group in an
# `if: always()` teardown. There are no standing Azure resources and no
# long-lived account-key secrets to manage.
#
# Coverage (each real backend is gated independently; a backend whose env is
# absent skips rather than fails). Deterministic failure-injection tests and
# the focused AMQP mapping tests run without Azure credentials:
#   S3        -> Blob Storage   (lifecycle + list pagination + multi-delete)
#   DynamoDB  -> Cosmos DB      (lifecycle + query/batch + conditional concurrency)
#   SQS       -> Service Bus    (lifecycle + list/batch + FIFO concurrency)
#   Kinesis   -> Event Hubs     (write/read/list/batch + consumer concurrency)
#   SNS       -> Service Bus    (topic/subscription lifecycle + lists + publish batch)
#                  + Event Grid (per-topic backend=EventGrid Publish/PublishBatch,
#                                verified end to end via a Storage Queue event
#                                subscription; issue #630)
#   Secrets   -> Key Vault      (lifecycle + version write + list pagination against
#                                an ephemeral, per-run
#                                RBAC vault provisioned by the Bicep; the proxy
#                                authenticates via GitHub OIDC workload identity,
#                                so no client secret is stored)
#
# One-time operator setup (OIDC + reaper) is documented in
# docs/testing/real-azure-nightly.md.
#
# mode: promote (default) certifies a genuinely new sealed candidate built from
# the commit currently checked out; candidate_run_id and candidate_run_attempt
# select that new candidate. mode: reaffirm renews correctness evidence freshness
# for the already-approved *historical* runtime instead: it ignores any supplied
# candidate_* inputs, resolves the candidate directly from the profile's current
# approved-runtime ledger, and still runs today's harness/tests at today's
# checkout while embedding the historical sealed runtime's identity/provenance in
# the emitted correctness candidate (mirroring workload-load-real-azure.yml's
# reaffirm-mode split between dispatch-day head_sha and historical candidate
# identity; see #803/#877/#889).
on:
  schedule:
    # Nightly at 05:00 UTC, an hour after the emulator `integration`
    # job so a failure here points at real-Azure-only divergence.
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      service:
        description: Service to run, or all services
        required: false
        default: all
        type: choice
        options:
          - all
          - s3
          - dynamodb
          - sqs
          - kinesis
          - sns
          - secretsmanager
      scenario:
        description: Optional scenario id (use service when the id is ambiguous)
        required: false
        type: string
      require_real_azure:
        description: Fail unless positive live-Azure verification evidence is produced
        required: false
        default: true
        type: boolean
      qualification_profile:
        description: Sealed profile candidate, or source-validation for non-qualifying checks
        required: true
        default: source-validation
        type: choice
        options:
          - source-validation
          - s3-basic-object-crud
          - secretsmanager-basic-lifecycle
          - dynamodb-basic-crud
          - dynamodb-query-scan-indexes
          - dynamodb-single-partition-transactions
          - sqs-standard-messaging
          - sqs-dlq-redrive
          - sqs-fifo-amqp
          - kinesis-single-consumer-per-shard
      mode:
        description: promote a new sealed candidate, or reaffirm the already-approved runtime
        required: true
        default: promote
        type: choice
        options:
          - promote
          - reaffirm
      candidate_run_id:
        description: Exact successful sealed-runtime producer run id
        required: false
        type: string
      candidate_run_attempt:
        description: Exact sealed-runtime producer attempt
        required: false
        default: '1'
        type: string
      candidate_artifact_id:
        description: Optional exact sealed artifact id
        required: false
        type: string
  pull_request:
    types: [labeled, synchronize, reopened]

permissions:
  actions: read
  attestations: read
  id-token: write   # required for the azure/login OIDC token exchange
  contents: read

jobs:
  real-azure:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       contains(github.event.pull_request.labels.*.name, 'run-real-azure'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Concurrency guard: never run two real-Azure jobs in parallel (cost +
    # the reaper's age heuristic both assume a single active run).
    concurrency:
      group: integration-real-azure
      cancel-in-progress: false
    env:
      AZURE_LOCATION: eastus2
      # Unique per run+attempt so retries never collide and the reaper can
      # always identify orphans by the shared `purpose` tag.
      RG_NAME: aws2azure-it-${{ github.run_id }}-${{ github.run_attempt }}
      DEPLOYMENT_NAME: aws2azure-realazure
      # The DynamoDB module creates containers but not the database, and the
      # Kinesis module does not implement CreateStream — Bicep pre-creates both
      # and the fixture targets these names.
      AZURE_COSMOS_DATABASE: dynamodb
      AZURE_EVENTHUBS_STREAM: kinesis-smoke
      AZURE_EVENTHUBS_PARTITION_COUNT: '2'
      TEST_RESULTS_DIR: TestResults/real-azure
      EVIDENCE_DIR: TestResults/real-azure-conformance
      # Must be absolute: ConformanceEvidenceStore.ResolveRoot() calls
      # Path.GetFullPath on this value, which resolves relative paths against
      # the dotnet-test host's working directory (not necessarily the repo
      # root), so a relative value here silently writes evidence somewhere
      # the later "Upload canonical real-Azure evidence" step never finds.
      AWS2AZURE_CONFORMANCE_EVIDENCE_DIR: ${{ github.workspace }}/TestResults/real-azure-conformance/canonical-cases
      CONFORMANCE_PLAN: TestResults/real-azure-conformance-plan.json
      QUALIFICATION_DIR: artifacts/real-azure-qualification
      PRIVATE_DIR: artifacts/real-azure-qualification-private
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/dotnet-setup

      - name: Select qualifying or source-validation mode
        id: mode
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_SERVICE: ${{ inputs.service || 'all' }}
          SELECTED_SCENARIO: ${{ inputs.scenario || '' }}
          REQUIRE_REAL_AZURE: ${{ inputs.require_real_azure || false }}
          QUALIFICATION_PROFILE: ${{ inputs.qualification_profile || 'source-validation' }}
          REQUALIFICATION_MODE: ${{ inputs.mode }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          REF: ${{ github.ref }}
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          qualification_sha="$(git rev-parse HEAD)"
          requalification_mode="${REQUALIFICATION_MODE:-promote}"
          qualifying=false
          runtime_mode=source_validation
          persisted_format_qualification=0
          profile=
          if [ "$EVENT_NAME" = workflow_dispatch ] &&
             [ "$QUALIFICATION_PROFILE" != source-validation ]; then
            case "$QUALIFICATION_PROFILE:$SELECTED_SERVICE" in
              s3-basic-object-crud:s3|secretsmanager-basic-lifecycle:secretsmanager|dynamodb-basic-crud:dynamodb|dynamodb-query-scan-indexes:dynamodb|dynamodb-single-partition-transactions:dynamodb|sqs-standard-messaging:sqs|sqs-dlq-redrive:sqs|sqs-fifo-amqp:sqs|kinesis-single-consumer-per-shard:kinesis)
                profile="$QUALIFICATION_PROFILE"
                ;;
              *)
                echo "::error::Sealed qualification profile must match service s3, secretsmanager, dynamodb, sqs, or kinesis."
                exit 1
                ;;
            esac
            if [ -n "$SELECTED_SCENARIO" ] || [ "$REQUIRE_REAL_AZURE" != true ]; then
              echo "::error::Sealed correctness requires the complete profile plan and enforced positive real-Azure evidence."
              exit 1
            fi
            if [ "$requalification_mode" = reaffirm ]; then
              if [ -n "$CANDIDATE_RUN_ID" ] || [ -n "$CANDIDATE_ARTIFACT_ID" ]; then
                echo "::error::mode=reaffirm resolves the candidate from the approved-runtime ledger; candidate_* inputs must be left blank."
                exit 1
              fi
            elif [[ ! "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]] ||
                 [[ ! "$CANDIDATE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]; then
              echo "::error::Sealed correctness requires numeric candidate run id and attempt."
              exit 1
            fi
            if [ "$REF_PROTECTED" != true ] ||
               { [ "$REF" != refs/heads/main ] &&
                 [[ ! "$REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+-rc([.-]?[0-9A-Za-z]+)*$ ]]; }; then
              echo "::error::Sealed qualification must run from protected main or an allowed RC tag."
              exit 1
            fi
            qualifying=true
            runtime_mode=candidate
            if [ "$profile" = dynamodb-single-partition-transactions ]; then
              runtime_mode=rollback
              persisted_format_qualification=1
            fi
          else
            requalification_mode=promote
          fi
          {
            echo "qualifying=$qualifying"
            echo "profile=$profile"
            echo "qualification_sha=$qualification_sha"
            echo "requalification_mode=$requalification_mode"
          } >> "$GITHUB_OUTPUT"
          {
            echo "AWS2AZURE_SEALED_RUNTIME_MODE=$runtime_mode"
            echo "AWS2AZURE_DDB_PERSISTED_FORMAT_QUALIFICATION=$persisted_format_qualification"
            echo "AWS2AZURE_QUALIFICATION_SHA=$qualification_sha"
            echo "AWS2AZURE_QUALIFICATION_PROFILE=$profile"
            echo "AWS2AZURE_QUALIFICATION_MODE=$requalification_mode"
          } >> "$GITHUB_ENV"

      # Provisioning needs the OIDC client id. When it is absent (fork PRs, or
      # before an operator has wired up OIDC) we skip provision/login/teardown;
      # live-backend tests then skip while credential-independent checks run.
      - name: Check provisioning credentials
        id: gate
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_OBJECT_ID: ${{ secrets.AZURE_CLIENT_OBJECT_ID }}
        run: |
          if [ -n "$AZURE_CLIENT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_CLIENT_ID not set — real-Azure provisioning skipped; RealAzure tests will skip."
          fi
          # The Workload-Identity E2E scenario (#307) requires the SP object id so
          # the Bicep grants data-plane RBAC; without it the WI proxy variant and
          # its tests skip, leaving the shared-key matrix untouched.
          if [ -n "$AZURE_CLIENT_ID" ] && [ -n "$AZURE_CLIENT_OBJECT_ID" ]; then
            echo "wi_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "wi_enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::AZURE_CLIENT_OBJECT_ID not set — WorkloadIdentity E2E scenario skipped."
          fi

      - name: Build test harness and validation tools
        run: dotnet build -c Release --nologo

      - name: Resolve exact sealed correctness candidate and transaction prior
        if: steps.mode.outputs.qualifying == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REQUALIFICATION_MODE: ${{ steps.mode.outputs.requalification_mode }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_RUN_ATTEMPT: ${{ inputs.candidate_run_attempt }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$PRIVATE_DIR"
          identity_dir="$QUALIFICATION_DIR/sealed-runtimes"
          install -d -m 0700 "$identity_dir"
          gap_docs="tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll"
          prior_ledger="$identity_dir/prior-ledger.json"

          if [ "$REQUALIFICATION_MODE" = reaffirm ]; then
            current_ledger="$identity_dir/current-ledger.json"
            dotnet exec "$gap_docs" export-approved-runtime \
              --profile "${{ steps.mode.outputs.profile }}" \
              --output "$current_ledger"
            chmod 0600 "$current_ledger"

            candidate_run_id="$(jq -er '.record.producer.run_id' "$current_ledger")"
            candidate_attempt="$(jq -er '.record.producer.run_attempt' "$current_ledger")"
            candidate_sha="$(jq -er '.record.runtime.source_sha' "$current_ledger")"
            candidate_ref="$(jq -er '.record.attestation.source_ref' "$current_ledger")"
            candidate_artifact_id="$(jq -er '.record.artifact.id' "$current_ledger")"
            ./eng/resolve-sealed-runtime.sh \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$candidate_run_id" \
              --run-attempt "$candidate_attempt" \
              --expected-sha "$candidate_sha" \
              --expected-ref "$candidate_ref" \
              --profile "${{ steps.mode.outputs.profile }}" \
              --profile-version 1 \
              --role candidate \
              --artifact-id "$candidate_artifact_id" \
              --destination "$PRIVATE_DIR/sealed-candidate" \
              --identity-output "$identity_dir/candidate-runtime.json" \
              --github-env "$GITHUB_ENV"

            if [ "${{ steps.mode.outputs.profile }}" = dynamodb-single-partition-transactions ]; then
              dotnet exec "$gap_docs" export-approved-runtime \
                --profile "${{ steps.mode.outputs.profile }}" \
                --rollback-target \
                --candidate "$identity_dir/candidate-runtime.json" \
                --ledger-json "$current_ledger" \
                --output "$prior_ledger"
              chmod 0600 "$prior_ledger"
            fi
          else
            candidate_args=(
              --repository "$GITHUB_REPOSITORY"
              --run-id "$CANDIDATE_RUN_ID"
              --run-attempt "$CANDIDATE_RUN_ATTEMPT"
              --expected-sha "${{ steps.mode.outputs.qualification_sha }}"
              --expected-ref "$GITHUB_REF"
              --profile "${{ steps.mode.outputs.profile }}"
              --profile-version 1
              --role candidate
              --destination "$PRIVATE_DIR/sealed-candidate"
              --identity-output "$identity_dir/candidate-runtime.json"
              --github-env "$GITHUB_ENV"
            )
            if [ -n "$CANDIDATE_ARTIFACT_ID" ]; then
              candidate_args+=(--artifact-id "$CANDIDATE_ARTIFACT_ID")
            fi
            ./eng/resolve-sealed-runtime.sh "${candidate_args[@]}"
          fi

          if [ "${{ steps.mode.outputs.profile }}" = dynamodb-single-partition-transactions ]; then
            if [ "$REQUALIFICATION_MODE" != reaffirm ]; then
              dotnet exec "$gap_docs" export-approved-runtime \
                --profile "${{ steps.mode.outputs.profile }}" \
                --output "$prior_ledger"
              chmod 0600 "$prior_ledger"
            fi

            prior_run_id="$(jq -er '.record.producer.run_id' "$prior_ledger")"
            prior_attempt="$(jq -er '.record.producer.run_attempt' "$prior_ledger")"
            prior_sha="$(jq -er '.record.runtime.source_sha' "$prior_ledger")"
            prior_ref="$(jq -er '.record.attestation.source_ref' "$prior_ledger")"
            prior_artifact_id="$(jq -er '.record.artifact.id' "$prior_ledger")"
            ./eng/resolve-sealed-runtime.sh \
              --repository "$GITHUB_REPOSITORY" \
              --run-id "$prior_run_id" \
              --run-attempt "$prior_attempt" \
              --expected-sha "$prior_sha" \
              --expected-ref "$prior_ref" \
              --profile "${{ steps.mode.outputs.profile }}" \
              --profile-version 1 \
              --role prior \
              --artifact-id "$prior_artifact_id" \
              --ledger-json "$prior_ledger" \
              --destination "$PRIVATE_DIR/sealed-prior" \
              --identity-output "$identity_dir/prior-runtime.json" \
              --github-env "$GITHUB_ENV"

            candidate_identity="$identity_dir/candidate-runtime.json"
            prior_identity="$identity_dir/prior-runtime.json"
            for field in source.sha runtime.aggregate_digest runtime.executable_digest; do
              candidate_value="$(jq -er ".$field" "$candidate_identity")"
              prior_value="$(jq -er ".$field" "$prior_identity")"
              if [ "$candidate_value" = "$prior_value" ]; then
                echo "::error::Transaction candidate and bootstrap prior must be distinct at $field."
                exit 1
              fi
            done
          fi
          cp "$PRIVATE_DIR/sealed-candidate/bundle/runtime-sha256.txt" \
            "$QUALIFICATION_DIR/runtime-sha256.txt"

      - name: Validate conformance matrix
        run: >-
          dotnet exec
          tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll
          --validate

      - name: Plan selected conformance scenarios
        id: plan
        env:
          SELECTED_SERVICE: ${{ inputs.service || 'all' }}
          SELECTED_SCENARIO: ${{ inputs.scenario || '' }}
          REQUESTED_REQUIRE_REAL_AZURE: ${{ inputs.require_real_azure || false }}
          QUALIFICATION_PROFILE: ${{ inputs.qualification_profile || 'source-validation' }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=()
          if [ "$SELECTED_SERVICE" != "all" ]; then
            args+=(--service "$SELECTED_SERVICE")
          fi
          if [ -n "$SELECTED_SCENARIO" ]; then
            args+=(--scenario "$SELECTED_SCENARIO")
          fi
          case "$QUALIFICATION_PROFILE" in
            sqs-standard-messaging)
              args+=(--exclude-scenario fifo-amqp-boundaries)
              args+=(--exclude-scenario dlq-redrive-boundaries)
              ;;
            sqs-fifo-amqp)
              args+=(--scenario fifo-amqp-boundaries)
              ;;
            sqs-dlq-redrive)
              args+=(--scenario dlq-redrive-boundaries)
              ;;
          esac
          if [ "$QUALIFICATION_PROFILE" != source-validation ]; then
            args+=(--profile "$QUALIFICATION_PROFILE")
          fi

          mkdir -p "$(dirname "$CONFORMANCE_PLAN")"
          dotnet exec tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll \
            plan-conformance "${args[@]}" --output "$CONFORMANCE_PLAN"

          ddb_sproc_mode="$(
            jq -er '.configuration.dynamo_db_stored_procedure_mode' "$CONFORMANCE_PLAN"
          )"
          case "$ddb_sproc_mode" in
            Disabled|Preferred) ;;
            *)
              echo "::error::Unsupported planned DynamoDB stored-procedure mode: $ddb_sproc_mode"
              exit 1
              ;;
          esac
          echo "AWS2AZURE_DDB_STORED_PROCEDURE_MODE=$ddb_sproc_mode" >> "$GITHUB_ENV"

          requires_real_azure="$(
            jq -r 'any(.scenarios[]; .evidence_source == "real_azure")' "$CONFORMANCE_PLAN"
          )"
          if [ "$EVENT_NAME" = "schedule" ]; then
            require_real_azure=true
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            require_real_azure="$REQUESTED_REQUIRE_REAL_AZURE"
          else
            require_real_azure=false
          fi
          echo "requires_real_azure=$requires_real_azure" >> "$GITHUB_OUTPUT"
          echo "require_real_azure=$require_real_azure" >> "$GITHUB_OUTPUT"
          {
            echo "## Selected conformance plan"
            echo
            echo "- Service: \`$SELECTED_SERVICE\`"
            echo "- Scenario: \`${SELECTED_SCENARIO:-all}\`"
            echo "- Scenarios: $(jq '.scenarios | length' "$CONFORMANCE_PLAN")"
            echo "- Scenario set: \`$(jq -r '.scenario_set_sha256' "$CONFORMANCE_PLAN")\`"
            echo "- DynamoDB stored procedures: \`$ddb_sproc_mode\`"
            echo "- Requires real Azure: \`$requires_real_azure\`"
            echo "- Enforce positive real-Azure evidence: \`$require_real_azure\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # VSTest exits zero when a filter matches no tests. Discover first and
      # require every matrix identity to match exactly (or a theory case with
      # the identity followed by its argument list) before constructing filters.
      - name: Verify planned test discovery
        run: >-
          dotnet exec
          tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll
          validate-conformance-discovery
          --plan "$CONFORMANCE_PLAN"
          --configuration Release
          --no-build

      - name: Build planned test filters
        id: filters
        run: |
          filter_for() {
            jq -r --arg project "$1" '
              [.test_projects[]
               | select(.project == $project)
               | .tests[]
               | "FullyQualifiedName=" + .]
              | join("|")
            ' "$CONFORMANCE_PLAN"
          }

          echo "integration=$(filter_for tests/Aws2Azure.IntegrationTests)" >> "$GITHUB_OUTPUT"
          echo "unit=$(filter_for tests/Aws2Azure.UnitTests)" >> "$GITHUB_OUTPUT"

      - name: Record runtime and non-secret qualification configuration
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QUALIFICATION_DIR"

          runtime_manifest="$QUALIFICATION_DIR/runtime-sha256.txt"
          if [ "${{ steps.mode.outputs.qualifying }}" != true ]; then
            (
              cd src/Aws2Azure.Proxy/bin/Release/net10.0
              find . -maxdepth 1 -type f \
                \( -name '*.dll' -o -name '*.json' -o -name 'Aws2Azure.Proxy' \) \
                -print0 |
                sort -z |
                xargs -0 sha256sum
            ) > "$GITHUB_WORKSPACE/$runtime_manifest"
          fi

          config_manifest="$QUALIFICATION_DIR/config-manifest.json"
          if [ "${{ steps.mode.outputs.qualifying }}" = true ] &&
             [ "${{ steps.mode.outputs.requalification_mode }}" = reaffirm ]; then
            # Reaffirmed correctness still runs today's harness/tests at today's
            # checkout, but the emitted candidate must honestly describe the
            # already-approved historical sealed runtime being re-certified. Re-
            # derive the candidate-facing config manifest from the candidate SHA's
            # committed sources (mirroring workload-load-real-azure.yml) so the
            # resulting config_digest stays anchored to the historical candidate,
            # not to the dispatch day's checkout.
            candidate_git_sha="$(
              jq -er '.source.sha' "$QUALIFICATION_DIR/sealed-runtimes/candidate-runtime.json"
            )"
            if ! git cat-file -e "$candidate_git_sha" 2>/dev/null; then
              git fetch --quiet --depth 1 origin "$candidate_git_sha"
            fi
            sha256_at_qualification_sha() {
              local path="$1"
              local digest
              digest="$(
                git show "$candidate_git_sha:$path" | sha256sum | cut -d' ' -f1
              )" || {
                echo "::error::Unable to read $path at candidate SHA $candidate_git_sha." >&2
                exit 1
              }
              printf '%s\n' "$digest"
            }

            config_git_sha="$candidate_git_sha"
            matrix_sha256="$(sha256_at_qualification_sha docs/testing/real-azure-conformance.yaml)"
            bicep_sha256="$(sha256_at_qualification_sha deploy/realazure/main.bicep)"
            workflow_sha256="$(sha256_at_qualification_sha .github/workflows/integration-real-azure.yml)"
          else
            config_git_sha="$(git rev-parse HEAD)"
            matrix_sha256="$(sha256sum docs/testing/real-azure-conformance.yaml | cut -d' ' -f1)"
            bicep_sha256="$(sha256sum deploy/realazure/main.bicep | cut -d' ' -f1)"
            workflow_sha256="$(sha256sum .github/workflows/integration-real-azure.yml | cut -d' ' -f1)"
          fi
          jq -n \
            --arg schema_version "1" \
            --arg git_sha "$config_git_sha" \
            --arg region "$AZURE_LOCATION" \
            --arg dynamodb_stored_procedure_mode "$AWS2AZURE_DDB_STORED_PROCEDURE_MODE" \
            --arg matrix_sha256 "$matrix_sha256" \
            --arg bicep_sha256 "$bicep_sha256" \
            --arg workflow_sha256 "$workflow_sha256" \
            '{
              schema_version: ($schema_version | tonumber),
              git_sha: $git_sha,
              region: $region,
              topology: "ephemeral-per-run",
              inputs: {
                cosmos_database: "dynamodb",
                event_hub: "kinesis-smoke",
                dynamodb_stored_procedure_mode: $dynamodb_stored_procedure_mode
              },
              source_digests: {
                conformance_matrix: ("sha256:" + $matrix_sha256),
                bicep: ("sha256:" + $bicep_sha256),
                workflow: ("sha256:" + $workflow_sha256)
              }
            }' > "$config_manifest"

          if [ "${{ steps.mode.outputs.qualifying }}" = true ]; then
            runtime_digest="$(jq -er '.runtime.aggregate_digest' "$QUALIFICATION_DIR/sealed-runtimes/candidate-runtime.json")"
          else
            runtime_digest="sha256:$(sha256sum "$runtime_manifest" | cut -d' ' -f1)"
          fi
          config_digest="sha256:$(sha256sum "$config_manifest" | cut -d' ' -f1)"
          {
            echo "runtime_digest=$runtime_digest"
            echo "config_digest=$config_digest"
          } >> "$GITHUB_OUTPUT"

      # The empty TRX is a truthful fallback: if a test host cannot start,
      # evidence generation still records matrix entries as not_run instead of
      # silently omitting the report.
      - name: Initialize deterministic results directory
        run: |
          mkdir -p "$TEST_RESULTS_DIR"
          cat > "$TEST_RESULTS_DIR/evidence-bootstrap.trx" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <TestRun xmlns="http://microsoft.com/schemas/VisualStudio/TeamTest/2010" />
          EOF

      - name: Run planned unit conformance tests
        id: unit_tests
        env:
          FILTER: ${{ steps.filters.outputs.unit }}
        run: |
          status=0
          if [ -n "$FILTER" ]; then
            dotnet test tests/Aws2Azure.UnitTests \
              -c Release --no-build --nologo \
              --filter "$FILTER" \
              --results-directory "$TEST_RESULTS_DIR" \
              --logger "trx;LogFileName=matrix-unit.trx" || status=$?
          else
            echo "::notice::Selected conformance plan contains no unit tests."
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        if: steps.gate.outputs.enabled == 'true' && steps.plan.outputs.requires_real_azure == 'true'
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision ephemeral Azure backends
        if: steps.gate.outputs.enabled == 'true' && steps.plan.outputs.requires_real_azure == 'true'
        env:
          # Object id of the OIDC service principal, for the data-plane RBAC role
          # assignments the WorkloadIdentity E2E scenario needs (issue #307). When
          # unset the Bicep skips every role assignment, so the shared-key smoke
          # matrix is unaffected and the job stays green.
          AZURE_CLIENT_OBJECT_ID: ${{ secrets.AZURE_CLIENT_OBJECT_ID }}
        run: |
          set -euo pipefail
          az group create -n "$RG_NAME" -l "$AZURE_LOCATION" \
            --tags purpose=aws2azure-nightly \
                   run-id="${{ github.run_id }}" \
                   created="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o none
          az deployment group create -g "$RG_NAME" -n "$DEPLOYMENT_NAME" \
            -f deploy/realazure/main.bicep \
            -p cosmosDatabaseName="$AZURE_COSMOS_DATABASE" \
               eventHubName="$AZURE_EVENTHUBS_STREAM" \
               principalId="${AZURE_CLIENT_OBJECT_ID:-}" \
            -o none

      - name: Export connection info
        if: steps.gate.outputs.enabled == 'true' && steps.plan.outputs.requires_real_azure == 'true'
        run: |
          set -euo pipefail
          out() {
            az deployment group show -g "$RG_NAME" -n "$DEPLOYMENT_NAME" \
              --query "properties.outputs.$1.value" -o tsv
          }
          STORAGE="$(out storageAccountName)"
          SB_NS="$(out serviceBusNamespaceName)"
          COSMOS="$(out cosmosAccountName)"
          COSMOS_ENDPOINT="$(out cosmosEndpoint)"
          EH_NS="$(out eventHubsNamespaceName)"
          KV_URI="$(out keyVaultUri)"
          EG_TOPIC="$(out eventGridTopicName)"
          EG_ENDPOINT="$(out eventGridTopicEndpoint)"
          EG_QUEUE="$(out eventGridEvidenceQueueName)"

          BLOB_KEY="$(az storage account keys list -n "$STORAGE" -g "$RG_NAME" --query '[0].value' -o tsv)"
          SB_CONN="$(az servicebus namespace authorization-rule keys list -g "$RG_NAME" \
            --namespace-name "$SB_NS" --name RootManageSharedAccessKey \
            --query primaryConnectionString -o tsv)"
          COSMOS_KEY="$(az cosmosdb keys list -n "$COSMOS" -g "$RG_NAME" --query primaryMasterKey -o tsv)"
          EH_CONN="$(az eventhubs namespace authorization-rule keys list -g "$RG_NAME" \
            --namespace-name "$EH_NS" --name RootManageSharedAccessKey \
            --query primaryConnectionString -o tsv)"
          EG_KEY="$(az eventgrid topic key list -n "$EG_TOPIC" -g "$RG_NAME" --query key1 -o tsv)"

          # Mask every secret before it lands in $GITHUB_ENV / logs.
          for v in "$BLOB_KEY" "$SB_CONN" "$COSMOS_KEY" "$EH_CONN" "$EG_KEY"; do
            echo "::add-mask::$v"
          done

          {
            echo "AZURE_BLOB_ACCOUNT=$STORAGE"
            echo "AZURE_BLOB_KEY=$BLOB_KEY"
            echo "AZURE_COSMOS_ENDPOINT=$COSMOS_ENDPOINT"
            echo "AZURE_COSMOS_KEY=$COSMOS_KEY"
            echo "AZURE_COSMOS_DATABASE=$AZURE_COSMOS_DATABASE"
            echo "AZURE_SB_CONNSTR=$SB_CONN"
            echo "AZURE_EVENTHUBS_CONNSTR=$EH_CONN"
            echo "AZURE_EVENTHUBS_STREAM=$AZURE_EVENTHUBS_STREAM"
            echo "AZURE_KEYVAULT_URL=$KV_URI"
            echo "AZURE_EVENTGRID_TOPIC_ENDPOINT=$EG_ENDPOINT"
            echo "AZURE_EVENTGRID_TOPIC_KEY=$EG_KEY"
            echo "AZURE_EVENTGRID_EVIDENCE_QUEUE_NAME=$EG_QUEUE"
          } >> "$GITHUB_ENV"

      - name: Mint federated token for workload identity scenarios
        if: steps.gate.outputs.wi_enabled == 'true' && steps.plan.outputs.requires_real_azure == 'true'
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          set -euo pipefail
          # Request a GitHub Actions OIDC token for the Azure AD exchange audience
          # and write it to a file the proxy's WorkloadIdentityTokenSource reads
          # (mirroring the AKS projected service-account token contract). The
          # token's `sub` claim matches the same federated credentials
          # azure/login already uses, so no extra Entra federation is needed. The
          # ACTIONS_ID_TOKEN_REQUEST_* vars are injected because the job has
          # `id-token: write`.
          install -d -m 0700 "$PRIVATE_DIR/tokens"
          TOKEN_FILE="$GITHUB_WORKSPACE/$PRIVATE_DIR/tokens/azure-federated-token.jwt"
          RESPONSE="$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange")"
          ASSERTION="$(printf '%s' "$RESPONSE" | python3 -c 'import sys, json; print(json.load(sys.stdin)["value"])')"
          if [ -z "$ASSERTION" ]; then
            echo "::error::Failed to obtain a GitHub OIDC token for the Workload Identity scenario."
            exit 1
          fi
          echo "::add-mask::$ASSERTION"
          ( umask 077; printf '%s' "$ASSERTION" > "$TOKEN_FILE" )
          {
            echo "AZURE_FEDERATED_TOKEN_FILE=$TOKEN_FILE"
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
          } >> "$GITHUB_ENV"

      - name: Run planned integration conformance tests
        id: integration_tests
        if: always()
        env:
          FILTER: ${{ steps.filters.outputs.integration }}
        run: |
          set -euo pipefail
          retryable_pattern='Entra ID token request failed with HTTP 401.'
          run_with_entra_401_retry() {
            local log_file=$1
            shift
            local attempt status
            for attempt in 1 2; do
              rm -f "$log_file"
              set +e
              "$@" 2>&1 | tee "$log_file"
              status=${PIPESTATUS[0]}
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if [ "$attempt" -ge 2 ] || ! grep -Fq "$retryable_pattern" "$log_file"; then
                return "$status"
              fi
              echo "::warning::Retrying planned integration tests after transient Entra token-endpoint 401 (issue #922)."
              sleep 1
            done
          }

          # AZURE_KEYVAULT_URL is exported from the ephemeral deployment output by
          # the "Export connection info" step (Secrets Manager -> Key Vault). When
          # provisioning is skipped (no OIDC) it stays unset and the SecretsManager
          # smoke skips. Workload-Identity auth uses the OIDC token minted above.
          status=0
          if [ -n "$FILTER" ]; then
            set +e
            run_with_entra_401_retry \
              "$TEST_RESULTS_DIR/matrix-integration-attempt.log" \
              dotnet test tests/Aws2Azure.IntegrationTests \
                -c Release --no-build --nologo \
                --filter "$FILTER" \
                --results-directory "$TEST_RESULTS_DIR" \
                --logger "trx;LogFileName=matrix-integration.trx"
            status=$?
            set -e
          else
            echo "::notice::Selected conformance plan contains no integration tests."
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Export shared happy-path case evidence
        id: case_evidence
        if: always()
        env:
          SELECTED_SERVICE: ${{ inputs.service || 'all' }}
        run: |
          set -euo pipefail
          retryable_pattern='Entra ID token request failed with HTTP 401.'
          run_with_entra_401_retry() {
            local log_file=$1
            shift
            local attempt status
            for attempt in 1 2; do
              rm -f "$log_file"
              set +e
              "$@" 2>&1 | tee "$log_file"
              status=${PIPESTATUS[0]}
              if [ "$status" -eq 0 ]; then
                return 0
              fi
              if [ "$attempt" -ge 2 ] || ! grep -Fq "$retryable_pattern" "$log_file"; then
                return "$status"
              fi
              echo "::warning::Retrying conformance evidence tests after transient Entra token-endpoint 401 (issue #922)."
              sleep 1
            done
          }

          status=0
          filter=
          case "$SELECTED_SERVICE" in
            all) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests" ;;
            s3) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests.S3_happy_path_cases_emit_real_azure_evidence" ;;
            dynamodb) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests.DynamoDb_happy_path_cases_emit_real_azure_evidence" ;;
            kinesis) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests.Kinesis_happy_path_cases_emit_real_azure_evidence" ;;
            sns) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests.Sns_happy_path_cases_emit_real_azure_evidence" ;;
            sqs) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests.Sqs_happy_path_cases_emit_real_azure_evidence" ;;
            secretsmanager) filter="FullyQualifiedName~RealAzureConformanceEvidenceTests.SecretsManager_happy_path_cases_emit_real_azure_evidence" ;;
            *)
              echo "::notice::Selected service has no shared happy-path conformance evidence cases."
              echo "exit_code=0" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          set +e
          run_with_entra_401_retry \
            "$TEST_RESULTS_DIR/conformance-case-evidence-attempt.log" \
            dotnet test tests/Aws2Azure.IntegrationTests \
              -c Release --no-build --nologo \
              --filter "$filter" \
              --results-directory "$TEST_RESULTS_DIR" \
              --logger "trx;LogFileName=conformance-case-evidence.trx"
          status=$?
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      # Raw canonical evidence files (not just the TRX/summary reports) are the
      # actual input the offline Tier-3 diff (RealAwsOfflineConformanceTests)
      # needs to pair against the real-AWS goldens committed under
      # tests/Aws2Azure.Conformance/fixtures. Publish them as their own artifact
      # so the separate tier3-real-diff.yml workflow can download and compare
      # without re-provisioning any live Azure resources.
      - name: Upload canonical real-Azure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-azure-canonical-evidence
          path: ${{ env.AWS2AZURE_CONFORMANCE_EVIDENCE_DIR }}
          if-no-files-found: warn

      # Generate immutable matrix evidence from every available TRX and refresh
      # the Theme C divergence dossier even when tests failed. The test steps
      # preserve their exit codes; a final gate after teardown restores failure.
      - name: Generate conformance evidence and divergence report
        id: reports
        if: always()
        run: |
          status=0
          evidence_args=(--plan "$CONFORMANCE_PLAN")
          if [ "${{ steps.plan.outputs.require_real_azure }}" = "true" ]; then
            evidence_args+=(--require-real-azure)
          fi

          dotnet exec tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll \
            --generate-evidence \
            --trx "$TEST_RESULTS_DIR" \
            --run-id "${{ github.run_id }}" \
            --run-url "$RUN_URL" \
            --evidence-output "$EVIDENCE_DIR" \
            "${evidence_args[@]}" || status=$?
          dotnet exec tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll \
            || status=$?

          if [ -f "$EVIDENCE_DIR/summary.md" ]; then
            cat "$EVIDENCE_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Conformance summary was not generated."
            status=1
          fi
          if [ -f docs/site/divergences.md ]; then
            {
              echo
              echo "## Documented divergences"
              echo
              grep -m1 'Operations:' docs/site/divergences.md || true
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Divergence report was not generated."
            status=1
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Generate workload correctness candidates
        id: qualification
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          status=0
          evidence="$EVIDENCE_DIR/real-azure-evidence.json"
          if [ "${{ steps.mode.outputs.qualifying }}" != true ]; then
            {
              echo "## Non-qualifying correctness validation"
              echo
              echo "No sealed correctness candidate was emitted. Scheduled, PR, and explicit source-validation runs are ineligible for final qualification."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$QUALIFICATION_DIR/candidates"
          if [ ! -f "$evidence" ]; then
            echo "::error::Conformance evidence is unavailable; workload candidates cannot be generated."
            echo "exit_code=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          profile="${{ steps.mode.outputs.profile }}"
          manifest="docs/workloads/$profile.yaml"
          output="$QUALIFICATION_DIR/candidates/$profile.yaml"
          candidate_git_sha="${{ steps.mode.outputs.qualification_sha }}"
          if [ "${{ steps.mode.outputs.requalification_mode }}" = reaffirm ]; then
            candidate_git_sha="$(
              jq -er '.source.sha' "$QUALIFICATION_DIR/sealed-runtimes/candidate-runtime.json"
            )"
          fi
          set +e
          dotnet exec tools/Aws2Azure.GapDocs/bin/Release/net10.0/Aws2Azure.GapDocs.dll \
            generate-real-azure-workload-qualification \
            --manifest "$manifest" \
            --evidence "$evidence" \
            --output "$output" \
            --git-sha "$candidate_git_sha" \
            --artifact-digest "${{ steps.provenance.outputs.runtime_digest }}" \
            --config-digest "${{ steps.provenance.outputs.config_digest }}" \
            --sealed-runtime-identity "$QUALIFICATION_DIR/sealed-runtimes/candidate-runtime.json" \
            --region "$AZURE_LOCATION" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend-description "Ephemeral Azure production SKUs from deploy/realazure/main.bicep"
          command_status=$?
          set -e

          if [ ! -f "$output" ] || [ "$command_status" -eq 1 ] || [ "$command_status" -eq 2 ]; then
            echo "::error::Failed to generate workload candidate for $profile (exit $command_status)."
            status=1
          else
            verdict="$(sed -n 's/^verdict: //p' "$output" | head -n 1)"
            if [ "$verdict" != candidate ]; then
              echo "::error::Sealed correctness must produce verdict 'candidate', not '$verdict'."
              status=1
            fi
            {
              echo "### $profile sealed correctness evidence"
              echo
              echo "- Evidence verdict: \`$verdict\`"
              echo "- Runtime: exact attested producer bytes; no source-built proxy was launched"
              echo "- Capacity claim: none; three production-shaped load runs are still required"
              echo "- Promotion claim: none; correctness evidence does not make the profile candidate, approved, or GA"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload conformance evidence
        if: always() && steps.mode.outputs.qualifying == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-azure-conformance
          path: |
            TestResults/real-azure-conformance-plan.json
            TestResults/real-azure/*.trx
            TestResults/real-azure-conformance/**
            artifacts/real-azure-qualification/runtime-sha256.txt
            artifacts/real-azure-qualification/config-manifest.json
            artifacts/real-azure-qualification/sealed-runtimes/**
            artifacts/real-azure-qualification/candidates/**
          if-no-files-found: error

      - name: Upload explicitly non-qualifying correctness validation
        if: always() && steps.mode.outputs.qualifying != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-validation-real-azure-conformance
          path: |
            TestResults/real-azure-conformance-plan.json
            TestResults/real-azure/*.trx
            TestResults/real-azure-conformance/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload divergence report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: real-azure-divergences
          path: docs/site/divergences.md
          if-no-files-found: warn

      # The deallocate guarantee: delete the ephemeral resource group even when
      # provisioning or the tests failed. Immutable storage with versioning
      # protects an account from deletion while it contains containers, so the
      # shared cleanup permanently deletes every blob version and waits for
      # Azure to confirm the resource-group deletion. The reaper backstops
      # force-cancelled runs.
      - name: Deallocate ephemeral Azure backends
        if: >-
          always() &&
          steps.gate.outputs.enabled == 'true' &&
          steps.plan.outputs.requires_real_azure == 'true'
        run: bash .github/scripts/cleanup-real-azure-resource-groups.sh "$RG_NAME"

      - name: Remove downloaded sealed runtime bytes
        if: always()
        run: rm -rf "$PRIVATE_DIR"

      - name: Enforce test and report results
        if: always()
        run: |
          failed=0
          # Test steps above run with `if: always()` and only capture their exit
          # code (not fail the job outright) so that the mandatory teardown steps
          # (Deallocate ephemeral Azure backends / Remove downloaded sealed
          # runtime bytes) still run even when a test fails — this step is the
          # single place that turns a captured failure back into a failed job,
          # once cleanup is done. Because of that indirection, the exit code
          # alone loses which test(s) actually failed; extract failed test names
          # from each step's TRX so the job's ::error:: annotation — the only
          # thing surfaced in the PR checks list — names the actual failure
          # instead of only the meta-step that noticed it.
          # This shell runs with `-e -o pipefail` (GitHub Actions' default for
          # `run:` steps), and `grep` exits non-zero when it finds no match
          # (e.g. a step's own .trx exists but recorded no `Failed` outcome).
          # `|| true` keeps that a soft "no matches" instead of aborting the
          # whole reporting step before later checks/exit run.
          failed_tests() {
            trx="$1"
            [ -f "$trx" ] || return 0
            { grep -o '<UnitTestResult[^>]*>' "$trx" \
              | grep 'outcome="Failed"' \
              | grep -oP 'testName="\K[^"]*'; } || true
          }
          check() {
            name="$1"
            value="$2"
            trx="$3"
            if ! [[ "$value" =~ ^[0-9]+$ ]] || [ "$value" -ne 0 ]; then
              detail=""
              if [ -n "$trx" ]; then
                names="$(failed_tests "$trx" | paste -sd '|' - || true)"
                [ -n "$names" ] && detail=" Failed test(s): ${names//|/ ;; }."
              fi
              echo "::error::$name failed or did not execute (exit code: ${value:-missing}).$detail"
              failed=1
            fi
          }
          check "Planned unit tests" "${{ steps.unit_tests.outputs.exit_code }}" "$TEST_RESULTS_DIR/matrix-unit.trx"
          check "Planned integration tests" "${{ steps.integration_tests.outputs.exit_code }}" "$TEST_RESULTS_DIR/matrix-integration.trx"
          check "Shared happy-path case evidence export" "${{ steps.case_evidence.outputs.exit_code }}" "$TEST_RESULTS_DIR/conformance-case-evidence.trx"
          check "Evidence/report generation" "${{ steps.reports.outputs.exit_code }}"
          check "Workload correctness candidate generation" "${{ steps.qualification.outputs.exit_code }}"
          exit "$failed"
