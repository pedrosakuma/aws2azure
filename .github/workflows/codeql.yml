name: codeql

on:
  push:
    branches: [main]
  schedule:
    # Weekly scan to catch newly published CodeQL query updates even without
    # code changes (Monday 06:00 UTC).
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Deliberately NOT triggered on pull_request: CodeQL C# analysis has shown
# timeout-prone/slow behavior in other repos, and we don't want it adding
# wait time (or noise in the checks list) to the critical PR merge path.
# It scans main after merge and weekly regardless.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: ./.github/actions/dotnet-setup

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          languages: csharp
          build-mode: manual

      # Manual build scoped to the shipping entry point only (Proxy pulls in
      # Core + all service modules transitively). Building the full solution
      # (tests/tools/benchmarks included) roughly triples CodeQL's C#
      # extraction time for no extra security signal on shipping code.
      - name: Build for analysis
        run: dotnet build src/Aws2Azure.Proxy/Aws2Azure.Proxy.csproj --configuration Release

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v3
        with:
          category: "/language:csharp"
